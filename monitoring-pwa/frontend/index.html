<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Nuage Notify</title>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent (ステータスバーの下に中身を潜らせる) にすると、iOS のホーム画面 PWA で
      画面がステータスバー分 (59pt) 縮んだまま最上端に置かれ、下に描けない帯が残った
      (iPhone 実機: screen=852 に対し innerHeight=793、html/body/#root を 852 にしても 793 で切れる)。
      不透明なステータスバーにして、画面がステータスバーの直下から下端まで届くようにする。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Notify" />
    <meta name="theme-color" content="#191816" />
    <!-- 書体 (IBM Plex Sans / JP / Mono) は @fontsource で同梱して配る (src/main.tsx)。オフラインでも崩れない -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
