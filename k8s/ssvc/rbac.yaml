# SSVC 評価 CronJob 用の最小権限。
# VulnerabilityReport・Ingress (露出の自動判定用)・Pod / Job (スキャン結果なしワークロードの検知用) の get / list だけを許す。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssvc
  namespace: ssvc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ssvc-reader
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ssvc-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ssvc-reader
subjects:
  - kind: ServiceAccount
    name: ssvc
    namespace: ssvc
