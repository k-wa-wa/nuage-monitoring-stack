# Ingress の /chaos-monitor 用。prod (k8s/overlays/prod/chaos-monitor-grafana.yaml) と同じ
# クラスター外の実体 (10.20.1.250) を指すだけだが、kustomize は overlay の外にある単体ファイルを
# resources に指定できないため、prod と同じ内容をここにも置いている。
# IP を変更するときは prod 側と両方直す。
apiVersion: v1
kind: Service
metadata:
  name: chaos-monitor-grafana
spec:
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: chaos-monitor-grafana-slice
  labels:
    kubernetes.io/service-name: chaos-monitor-grafana
addressType: IPv4
ports:
- port: 3000
  protocol: TCP
endpoints:
- addresses:
  - 10.20.1.250
  conditions: {}
