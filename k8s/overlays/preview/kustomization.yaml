# PRのpreview環境。
# - monitoring-pwa frontend/backend: このPRのイメージ (DBは毎回まっさらなPVC)
# - Helm チャート一式 (victoria-metrics-k8s-stack) は入れない。
#   CRDがクラスター共有・vlagentはDaemonSet・監視対象はクラスター本体そのものなので、
#   PRごとに複製しても意味がなく重いだけ。base/ ごと取り込まず monitoring-pwa だけを取り込む。
# - VMRule / Grafana ダッシュボードも入れない。特に VMRule は vmalert が全namespaceを対象にするため、
#   preview namespace に置くと prod の vmalert に同じアラートが二重登録される。
# - PWA は通知専用であり、Grafana 等のリンクは本番 URL (https://monitoring.wpcapp.net/grafana/...) を直接参照する。
#
# VAPIDキーはpreview用のダミーを平文で持つため、pechkaと違い
# argocd-vault-plugin を使う別Applicationは不要で、このoverlay 1本で完結する。
#
# namespace名・イメージタグ・ingress hostはArgoCD側のネイティブなkustomize.namespace/images/patches
# 上書きでPRごとに書き換える。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base/monitoring-pwa
  - local-secrets.yaml
  - echo-bot.yaml
  - ingress.yaml

patches:
  # base/monitoring-pwa には Grafana ダッシュボードのConfigMapも含まれるが、
  # preview に prod と同名のダッシュボードを増やしたくないため取り除く。
  - target:
      kind: ConfigMap
      name: grafana-dashboard-node-health
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-node-health
  - target:
      kind: ConfigMap
      name: grafana-dashboard-ai-agent
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-ai-agent
  - target:
      kind: ConfigMap
      name: grafana-dashboard-wall
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-wall
  - target:
      kind: ConfigMap
      name: grafana-dashboard-honeytrap
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-honeytrap
  - target:
      kind: ConfigMap
      name: grafana-dashboard-honeypot
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-honeypot
  # リソース節約のため、preview 環境では frontend を 1 レプリカにし、PodDisruptionBudget を除外する。
  - target:
      kind: Deployment
      name: monitoring-pwa-frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: monitoring-pwa-frontend
      spec:
        replicas: 1
  - target:
      kind: PodDisruptionBudget
      name: monitoring-pwa-frontend-pdb
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: monitoring-pwa-frontend-pdb
  # preview は nuage-cluster の preview-isolation-guardrail (CiliumClusterwideNetworkPolicy) で
  # 本番の namespace へ通れず、本番の Alertmanager と突き合わせられない。明示的に止める
  # (Alertmanager の Webhook も preview には届かない。試す時は preview の /webhook/alertmanager に送る)。
  - target:
      kind: Deployment
      name: monitoring-pwa-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ALERT_RECONCILE
          value: "off"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPIFFE_JWT_AUDIENCE
          value: "monitoring-pwa.$(POD_NAMESPACE)"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BOT_USERS_JSON
          value: '[{"sub":"spiffe://nuage/ns/$(POD_NAMESPACE)/sa/echo-bot","user_id":"U02ECHOBOT","bot_id":"B02ECHOBOT","name":"echo-bot","is_default":true},{"sub":"spiffe://nuage/host/atelier/bot","user_id":"U01BOT","bot_id":"B01BOT","name":"nuage-bot"}]'
