# host / tls は ApplicationSet の template (ArgoCDネイティブのkustomize.patches) で
# PR ごとに書き換えられる (base値はダミー)。
# *.wpcapp.net は CoreDNS (nix/hosts/loadbalancer/dns.nix) がワイルドカードで
# 192.168.5.200 に解決するため、PRごとのホスト追加は不要。
#
# preview 環境では monitoring-pwa の API・Webhook・フロントエンドのみを公開する。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-pwa-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare-prod"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - DUMMY
      secretName: monitoring-pwa-tls-secret
  rules:
    - host: DUMMY
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-backend
                port:
                  number: 80
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-backend
                port:
                  number: 80
          - path: /slack
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-frontend
                port:
                  number: 80
