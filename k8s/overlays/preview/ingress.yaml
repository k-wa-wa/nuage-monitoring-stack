# host / tls は ApplicationSet の template (ArgoCDネイティブのkustomize.patches) で
# PR ごとに書き換えられる (base値はダミー)。
# *.cluster.wpc は CoreDNS (nix/hosts/loadbalancer/dns.nix) がワイルドカードで
# 192.168.5.200 に解決するため、PRごとのホスト追加は不要。
#
# prod の grafana.cluster.wpc に相当する単独ホストは作らず、パス構成だけ prod に揃える。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-pwa-ingress
  annotations:
    cert-manager.io/cluster-issuer: "ca-clusterissuer"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - DUMMY
      secretName: monitoring-pwa-tls-secret
  rules:
    - host: DUMMY
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-backend
                port:
                  number: 80
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-backend
                port:
                  number: 80
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
          - path: /chaos-monitor
            pathType: Prefix
            backend:
              service:
                name: chaos-monitor-grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-pwa-frontend
                port:
                  number: 80
