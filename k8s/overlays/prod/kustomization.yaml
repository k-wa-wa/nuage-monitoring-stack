apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# この overlay は namespace を指定しない。
# 監視スタック本体は nuage-monitoring-stack、trivy-operator 一式は trivy-operator、リポジトリのスキャンは repo-scan と、Namespace が複数あるため、
# それぞれの kustomization (../../base、../../trivy-operator、../../repo-scan) で指定する。
# この overlay に直接置くリソースは、metadata.namespace を各ファイルに書く。

resources:
  - ../../base
  - ingress.yaml
  - chaos-monitor-grafana.yaml
  - secrets/secrets.yaml
  - ../../trivy-operator
  - ../../repo-scan
  - ../../ssvc

patches:
  - target:
      kind: Deployment
      name: monitoring-pwa-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPIFFE_JWT_AUDIENCE
          value: "monitoring-pwa"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BOT_USERS_JSON
          value: '[{"sub":"spiffe://nuage/host/atelier/bot","user_id":"U01BOT","bot_id":"B01BOT","name":"nuage-bot","is_default":true}]'
