# Victoria スタック (VictoriaMetrics + VictoriaLogs)。
# exporter・スクレイプ設定・ルール・ダッシュボード・Grafana をすべてこのスタックで持つ。
#
# 構成:
# - VMSingle / VLSingle をレプリカ a (このチャートが作る "vm") と b (victoria/replica-b.yaml) の 2 台、別ノードに置く
# - vmagent / vlagent は a と b の両方に書き込む。片方が止まっている間の分は永続キューに溜めて、復帰後に送る
# - 読み取りは vmauth が a と b のうち生きている方に振る (first_available)。削除系 API は url_map に載せず通さない
fullnameOverride: vm

victoria-metrics-operator:
  enabled: true
  crds:
    # pre-delete hook の Job で全 CR を消す仕組み。Argo CD では pre-delete hook として扱われないため無効化する
    cleanup:
      enabled: false
  # 証明書を描画のたびに生成するため、Argo CD で常に差分が出る。検証 webhook は使わない
  admissionWebhooks:
    enabled: false
  operator:
    # Prometheus Operator の CRD (ServiceMonitor / PrometheusRule) は使わない。取得対象・ルールは VM の CR で持つ
    disable_prometheus_converter: true

# 既定のルールとダッシュボードを取得して VMRule / ConfigMap を作る Job。
# Helm の post-install hook であり、Argo CD では PostSync hook として同期のたびに実行される
syncJob:
  enabled: true

defaultRules:
  enabled: true
  rules:
    # Argo Workflows の Pod を除外したカスタムルール (victoria/rules.yaml) を代わりに使う
    KubePodNotReady:
      enabled: false

defaultDashboards:
  enabled: true

# --- exporter / スクレイプ対象 ---

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

kubelet:
  enabled: true
kubeApiServer:
  enabled: true
# チャートの coreDns は kube-system に Service を作る前提だが、overlay の namespace 指定で
# nuage-monitoring-stack に移されて Pod を選べなくなるため、victoria/scrape-coredns.yaml の VMPodScrape で取る
coreDns:
  enabled: false

# Talos では etcd / controller-manager / scheduler のメトリクスは 127.0.0.1 にバインドされ、
# kube-proxy は Cilium で置き換えているため取らない
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeDns:
  enabled: false

# --- 保存先 ---

# TODO: TrueNAS の iSCSI (静的 PV) に移すまでは local-path に置く
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "100y"
    extraArgs:
      # TrueNAS へ移すまではノードのディスクに置くため、空きが減ったら書き込みを止めてノードを守る
      storage.minFreeDiskSpaceBytes: "20GB"
    storage:
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi

vlsingle:
  enabled: true
  spec:
    retentionPeriod: "100y"
    extraArgs:
      # TrueNAS へ移すまではノードのディスクに置くため、空きが減ったら書き込みを止めてノードを守る
      storage.minFreeDiskSpaceBytes: "20GB"
    storage:
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi

# --- 収集 ---

vmagent:
  # レプリカ b にも同じデータを書き込む
  additionalRemoteWrites:
    - url: http://vmsingle-vm-b.nuage-monitoring-stack.svc:8428/api/v1/write
  spec:
    scrapeInterval: 30s
    # 送信先が止まっている間のキューを Pod の再起動で失わないよう、PVC に置く
    statefulMode: true
    statefulStorage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

# k8s のログ収集 (DaemonSet) と、クラスタ外からのログ投入 (journald / OpenTelemetry) の受け口を兼ねる。
# キューはノードの hostPath (/var/lib/vlagent-data) に置かれるため、Pod の再起動では失われない
vlagent:
  enabled: true
  additionalRemoteWrites:
    - url: http://vlsingle-vm-b.nuage-monitoring-stack.svc:9428/insert/native
  spec:
    k8sCollector:
      enabled: true
    # control plane ノードのログも集める
    tolerations:
      - operator: Exists
    extraArgs:
      # 既定の _SYSTEMD_UNIT だと sshd@ の接続ごとに stream が分かれて増えるため、プロセス名でまとめる
      journald.streamFields: _HOSTNAME,SYSLOG_IDENTIFIER

# --- アラート ---

vmalert:
  enabled: true
  # ALERTS などの書き込みを vmagent 経由にして、a と b の両方に残す
  remoteWriteVMAgent: true
  spec:
    extraArgs:
      # アラートから Grafana の Explore へのリンク。チャート既定は defaultDatasources.victoriametrics の
      # 先頭を参照するが、それを空にしている (extra で定義している) ため明示する。値はチャート内で tpl を通る
      external.alert.source: 'explore?left={"datasource":"VictoriaMetrics","queries":[{"expr":{{"{{"}} .Expr|jsonEscape|queryEscape {{"}}"}},"refId":"A"}],"range":{"from":"{{"{{"}} .ActiveAt.UnixMilli {{"}}"}}","to":"now"}}'
    # アラート状態の復元も a/b のうち生きている方から読む
    remoteRead:
      url: http://vmauth-vm-internal.nuage-monitoring-stack.svc:8427

# vmalert の datasource。チャート既定はレプリカ a だけを向くため、a/b の生きている方に振るよう上書きする
internal:
  vmauth:
    spec:
      port: "8427"
      unauthorizedUserAccessSpec:
        url_map:
          - src_paths:
              - /select/logsql/.*
            url_prefix:
              - http://vlsingle-vm.nuage-monitoring-stack.svc:9428/
              - http://vlsingle-vm-b.nuage-monitoring-stack.svc:9428/
            load_balancing_policy: first_available
          - src_paths:
              - /.*
            url_prefix:
              - http://vmsingle-vm.nuage-monitoring-stack.svc:8428/
              - http://vmsingle-vm-b.nuage-monitoring-stack.svc:8428/
            load_balancing_policy: first_available

# pwa-notifier (monitoring-pwa の Web Push) へ通知する。
# pwa-notifier は有効な VAPID キーペア (pwa-notifier-secret) が用意されている前提である。
# チャート既定の config を丸ごと置き換える。
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: pwa-notifier
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog は死活監視用の常時発火アラートであり、通知しない
        # InfoInhibitor は info の抑止用の内部アラートであり、通知しない
        - receiver: "null"
          matchers:
            - alertname=~"Watchdog|InfoInhibitor"
    inhibit_rules:
      # InfoInhibitor が発火している間は info レベルを抑止する (kube-prometheus の既定と同じ)
      - target_matchers:
          - severity=info
        source_matchers:
          - alertname=InfoInhibitor
        equal:
          - namespace
    receivers:
      - name: pwa-notifier
        webhook_configs:
          - url: http://monitoring-pwa-backend.nuage-monitoring-stack.svc.cluster.local/webhook/alertmanager
            send_resolved: true
      - name: "null"

# --- 入口 ---

# 外部向けの入口 (Grafana、lb の journald など)。
# 読み取りは a/b のうち生きている方に振る。削除系 API は載せないことで通さない
vmauth:
  enabled: true
  spec:
    unauthorizedUserAccessSpec:
      disabled: false
      discover_backend_ips: false
      url_map:
        # メトリクスの参照
        - src_paths:
            - /api/v1/query.*
            - /api/v1/series
            - /api/v1/labels
            - /api/v1/label/.*
            - /api/v1/status/.*
            - /api/v1/metadata
            - /vmui.*
          url_prefix:
            - http://vmsingle-vm.nuage-monitoring-stack.svc:8428/
            - http://vmsingle-vm-b.nuage-monitoring-stack.svc:8428/
          load_balancing_policy: first_available
        # ログの参照
        - src_paths:
            - /select/.*
          url_prefix:
            - http://vlsingle-vm.nuage-monitoring-stack.svc:9428/
            - http://vlsingle-vm-b.nuage-monitoring-stack.svc:9428/
          load_balancing_policy: first_available
        # ログの投入。a と b の両方に書く必要があるため vlagent を経由する
        - src_paths:
            - /insert/.*
          url_prefix:
            - http://vlagent-vm.nuage-monitoring-stack.svc:9429/

# --- Grafana ---

# チャート既定のデータソースはレプリカ a を直接向くため使わず、extra で vmauth 経由のものを定義する
defaultDatasources:
  victoriametrics:
    datasources: []
  victorialogs:
    datasources: []
  extra:
    - name: VictoriaMetrics
      type: prometheus
      uid: VictoriaMetrics
      url: http://vmauth-vm.nuage-monitoring-stack.svc:8427/
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      uid: VictoriaLogs
      url: http://vmauth-vm.nuage-monitoring-stack.svc:8427/
      access: proxy
      isDefault: false

grafana:
  enabled: true
  # 描画のたびにランダムなパスワードが生成されて Argo CD で差分が出るのを防ぐため固定する
  adminPassword: prom-operator
  plugins:
    - victoriametrics-logs-datasource
  sidecar:
    datasources:
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      # monitoring-pwa の node-health ダッシュボード (label grafana_dashboard) も読み込む
      label: grafana_dashboard
      labelValue: "1"
  grafana.ini:
    server:
      root_url: "https://monitoring.wpcapp.net/grafana/"
      serve_from_sub_path: true
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_name: "Main Org."
      org_role: "Viewer"
  vmScrape:
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: grafana
          app.kubernetes.io/instance: vm
      endpoints:
        - port: service
          # serve_from_sub_path のため、メトリクスも /grafana 配下で返る
          path: /grafana/metrics
