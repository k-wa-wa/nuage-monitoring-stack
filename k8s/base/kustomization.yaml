apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 監視スタック本体の Namespace。prod overlay は trivy-operator (別 Namespace) も含むため、overlay ではなくここで指定する
namespace: nuage-monitoring-stack

resources:
  - namespace.yaml
  - monitoring-pwa
  - victoria

# Victoria スタック。helm テンプレート内の URL が Release の namespace を使うため namespace を明示する
helmCharts:
- name: victoria-metrics-k8s-stack
  releaseName: vm
  namespace: nuage-monitoring-stack
  version: 0.93.0
  repo: https://victoriametrics.github.io/helm-charts/
  includeCRDs: true
  valuesFile: helm/victoria-stack-custom.yaml
