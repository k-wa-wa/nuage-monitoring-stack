# カスタムのアラートルール。
# - custom-kubernetes-apps-rules: 既定の KubePodNotReady を置き換えるカスタム版
# - external-nodes-rules: クラスタ外の NixOS ホスト (job="external-nodes") のディスク・CPU・メモリ・systemd 失敗・MVS バッチジョブ失敗検知
# - k8s-error-logs: Pod のエラーログ検知およびホスト journald の systemd 失敗検知 (VictoriaLogs)
# - trivy-summary-rules: 壁掛けダッシュボード (uid nuage-wall) と Trivy ダッシュボード (uid trivy-operator) で使う trivy-operator の脆弱性・設定不備の件数と、Trivy ダッシュボードで使うスキャン対象のワークロード一覧 (recording rule)
# - repo-scan-rules: リポジトリのスキャン (k8s/repo-scan の CronJob) が 36 時間以上成功していないリポジトリの検知
# - honeytrap-rules: 侵入検知ハニーポット (nuage-honeytrap) の攻撃ログ検知 (VictoriaLogs)
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: custom-kubernetes-apps-rules
spec:
  groups:
    - name: custom-kubernetes-apps
      rules:
        # Argo Workflows のステップ Pod（owner_kind="Workflow"）が Error 状態で終了し、
        # ログ保持目的で残存している場合に KubePodNotReady アラートが誤発報するのを防ぐため、
        # 標準の owner_kind!="Job" に加えて owner_kind!~"Job|Workflow" を指定したカスタムルールを定義する。
        # record: "" は CRD の既定値。省略すると実機との差分が残って Argo CD が OutOfSync のままになるため明示する
        - alert: KubePodNotReady
          record: ""
          annotations:
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for longer than 15 minutes on cluster {{ $labels.cluster }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodnotready
            summary: Pod has been in a non-ready state for more than 15 minutes.
          expr: |-
            sum by (namespace, pod, cluster) (
              max by (namespace, pod, cluster) (
                kube_pod_status_phase{job="kube-state-metrics", namespace=~".*", phase=~"Pending|Unknown|Failed"}
              ) * on (namespace, pod, cluster) group_left(owner_kind) topk by (namespace, pod, cluster) (
                1, max by (namespace, pod, owner_kind, cluster) (kube_pod_owner{owner_kind!~"Job|Workflow"})
              )
            ) > 0
          for: 15m
          labels:
            severity: warning
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: external-nodes-rules
spec:
  groups:
    - name: external-nodes
      rules:
        # 既定の NodeSystemdServiceFailed / NodeSystemdServiceCrashlooping は job="node-exporter" (k8s ノード) のみが対象のため、
        # VMStaticScrape (job="external-nodes") で収集する NixOS ホスト向けのルールを定義する
        - alert: NodeSystemdServiceFailed
          record: ""
          annotations:
            description: Systemd service {{ $labels.name }} has entered failed state at {{ $labels.instance }}
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemdservicefailed
            summary: Systemd service has entered failed state.
          expr: node_systemd_unit_state{job="external-nodes",state="failed"} == 1
          for: 5m
          labels:
            severity: warning
        - alert: NodeSystemdServiceCrashlooping
          record: ""
          annotations:
            description: Systemd service {{ $labels.name }} has being restarted too many times at {{ $labels.instance }} for the last 15 minutes. Please check if service is crash looping.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemdservicecrashlooping
            summary: Systemd service keeps restarting, possibly crash looping.
          expr: increase(node_systemd_service_restart_total{job="external-nodes"}[5m]) > 2
          for: 15m
          labels:
            severity: warning
        # 既定のディスク・CPU・メモリのアラート (node-exporter mixin の group node-exporter) も job="node-exporter" (k8s ノード) のみが対象のため、
        # 同じ条件・閾値・severity で job="external-nodes" 向けに定義する。既定ルールは変えずに追加で対応する。
        # 元: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/nodeExporter-prometheusRule.yaml
        - alert: NodeFilesystemSpaceFillingUp
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left and is filling up."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemspacefillingup"
            summary: "Filesystem is predicted to run out of space within the next 24 hours."
          expr: |-
            (
              node_filesystem_avail_bytes{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_size_bytes{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 15
            and
              predict_linear(node_filesystem_avail_bytes{job="external-nodes",fstype!="",mountpoint!=""}[6h], 24*60*60) < 0
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 1h
          labels:
            severity: warning
        - alert: NodeFilesystemSpaceFillingUp
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left and is filling up fast."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemspacefillingup"
            summary: "Filesystem is predicted to run out of space within the next 4 hours."
          expr: |-
            (
              node_filesystem_avail_bytes{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_size_bytes{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 10
            and
              predict_linear(node_filesystem_avail_bytes{job="external-nodes",fstype!="",mountpoint!=""}[6h], 4*60*60) < 0
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 1h
          labels:
            severity: critical
        - alert: NodeFilesystemAlmostOutOfSpace
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace"
            summary: "Filesystem has less than 5% space left."
          expr: |-
            (
              node_filesystem_avail_bytes{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_size_bytes{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 5
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 30m
          labels:
            severity: warning
        - alert: NodeFilesystemAlmostOutOfSpace
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace"
            summary: "Filesystem has less than 3% space left."
          expr: |-
            (
              node_filesystem_avail_bytes{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_size_bytes{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 3
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 30m
          labels:
            severity: critical
        - alert: NodeFilesystemFilesFillingUp
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left and is filling up."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemfilesfillingup"
            summary: "Filesystem is predicted to run out of inodes within the next 24 hours."
          expr: |-
            (
              node_filesystem_files_free{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_files{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 40
            and
              predict_linear(node_filesystem_files_free{job="external-nodes",fstype!="",mountpoint!=""}[6h], 24*60*60) < 0
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 1h
          labels:
            severity: warning
        - alert: NodeFilesystemFilesFillingUp
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left and is filling up fast."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemfilesfillingup"
            summary: "Filesystem is predicted to run out of inodes within the next 4 hours."
          expr: |-
            (
              node_filesystem_files_free{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_files{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 20
            and
              predict_linear(node_filesystem_files_free{job="external-nodes",fstype!="",mountpoint!=""}[6h], 4*60*60) < 0
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 1h
          labels:
            severity: critical
        - alert: NodeFilesystemAlmostOutOfFiles
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutoffiles"
            summary: "Filesystem has less than 5% inodes left."
          expr: |-
            (
              node_filesystem_files_free{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_files{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 5
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 1h
          labels:
            severity: warning
        - alert: NodeFilesystemAlmostOutOfFiles
          record: ""
          annotations:
            description: "Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutoffiles"
            summary: "Filesystem has less than 3% inodes left."
          expr: |-
            (
              node_filesystem_files_free{job="external-nodes",fstype!="",mountpoint!=""} / node_filesystem_files{job="external-nodes",fstype!="",mountpoint!=""} * 100 < 3
            and
              node_filesystem_readonly{job="external-nodes",fstype!="",mountpoint!=""} == 0
            )
          for: 1h
          labels:
            severity: critical
        - alert: NodeCPUHighUsage
          record: ""
          annotations:
            description: "CPU usage at {{ $labels.instance }} has been above 90% for the last 15 minutes, is currently at {{ printf \"%.2f\" $value }}%."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodecpuhighusage"
            summary: "High CPU usage."
          expr: |-
            sum without(mode) (avg without (cpu) (rate(node_cpu_seconds_total{job="external-nodes", mode!~"idle|iowait"}[2m]))) * 100 > 90
          for: 15m
          labels:
            severity: info
        - alert: NodeSystemSaturation
          record: ""
          annotations:
            description: "System load per core at {{ $labels.instance }} has been above 2 for the last 15 minutes, is currently at {{ printf \"%.2f\" $value }}.\nThis might indicate this instance resources saturation and can cause it becoming unresponsive."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemsaturation"
            summary: "System saturated, load per core is very high."
          expr: |-
            node_load1{job="external-nodes"}
            / count without (cpu, mode) (node_cpu_seconds_total{job="external-nodes", mode="idle"}) > 2
          for: 15m
          labels:
            severity: warning
        - alert: NodeMemoryMajorPagesFaults
          record: ""
          annotations:
            description: "Memory major pages are occurring at very high rate at {{ $labels.instance }}, 500 major page faults per second for the last 15 minutes, is currently at {{ printf \"%.2f\" $value }}.\nPlease check that there is enough memory available at this instance."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodememorymajorpagesfaults"
            summary: "Memory major page faults are occurring at very high rate."
          expr: |-
            rate(node_vmstat_pgmajfault{job="external-nodes"}[5m]) > 500
          for: 15m
          labels:
            severity: warning
        - alert: NodeMemoryHighUtilization
          record: ""
          annotations:
            description: "Memory is filling up at {{ $labels.instance }}, has been above 90% for the last 15 minutes, is currently at {{ printf \"%.2f\" $value }}%."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodememoryhighutilization"
            summary: "Host is running out of memory."
          expr: |-
            100 - (node_memory_MemAvailable_bytes{job="external-nodes"} / node_memory_MemTotal_bytes{job="external-nodes"} * 100) > 90
          for: 15m
          labels:
            severity: warning
        - alert: NodeDiskIOSaturation
          record: ""
          annotations:
            description: "Disk IO queue (aqu-sq) is high on {{ $labels.device }} at {{ $labels.instance }}, has been above 10 for the last 30 minutes, is currently at {{ printf \"%.2f\" $value }}.\nThis symptom might indicate disk saturation."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/node/nodediskiosaturation"
            summary: "Disk IO queue is high."
          expr: |-
            rate(node_disk_io_time_weighted_seconds_total{job="external-nodes", device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m]) > 10
          for: 30m
          labels:
            severity: warning
        # mainframe の MVS バッチジョブの失敗・未実行検知。
        # LEDGER の GET ステップ RC 4 (締める日が無い)、LEDGMON の MONSEL ステップ RC 4 (締める月が無い)、
        # および MVSLCAT の RC 4 (未作成データセットの確認) は正常終了として扱う
        - alert: MvsJobFailed
          record: ""
          annotations:
            summary: "MVS ジョブ {{ $labels.job_name }} が失敗した (RC={{ $value }})"
            description: "mainframe ({{ $labels.instance }}) の MVS ジョブ {{ $labels.job_name }} の直近の実行が異常終了した (RC={{ $value }})。"
          expr: |-
            mvs_job_last_rc{job_name!~"LEDGER|LEDGMON|MVSLCAT"} > 0
            or
            (mvs_job_last_rc{job_name=~"LEDGER|LEDGMON"} > 0 and mvs_job_last_rc{job_name=~"LEDGER|LEDGMON"} != 4)
            or
            mvs_job_last_rc{job_name="MVSLCAT"} > 4
          for: 1m
          labels:
            severity: warning
        - alert: MvsJobNotRun
          record: ""
          annotations:
            summary: "MVS 日次ジョブ {{ $labels.job_name }} が 26 時間以上成功していない"
            description: "mainframe ({{ $labels.instance }}) の MVS 日次ジョブ {{ $labels.job_name }} が最後の成功から 26 時間以上経過している。ZTIMER または Hercules の状態を確認すること。"
          expr: |-
            time() - mvs_job_last_success_timestamp_seconds{job_name=~"USAGERPT|LEDGER"} > 26 * 3600
          for: 5m
          labels:
            severity: warning
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: k8s-error-logs
spec:
  groups:
    - name: k8s-error-logs
      type: vlogs
      interval: 1m
      rules:
        - alert: KubernetesPodErrorLogs
          record: ""
          # 除外パターン (False Positive 対策)。無害なログによる誤検知が発生した場合はここに NOT 条件を追記する。
          # 1. gRPC ストリーム切断ログ (EOF)
          #    argo-server の WatchWorkflows ストリーム終了時に error="rpc error: code = ResourceExhausted desc = EOF"
          #    を含む Warning ログが出力され、誤検知が発生したため除外。
          expr: |-
            _time:5m kubernetes.pod_namespace:~"^(pechka|bare-web-proxy)$" ~"(?i)error"
              NOT ~"(?i)code = ResourceExhausted desc = EOF"
            | rename kubernetes.pod_namespace as namespace, kubernetes.pod_name as pod, kubernetes.container_name as container
            | stats by (namespace, pod, container) count() as errors
            | filter errors:>0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} でエラーログを検出した"
            description: "container={{ $labels.container }} が過去5分間にエラーログを出力している。"
        - alert: HostSystemdUnitFailed
          record: ""
          # ホストの journald から systemd ユニットの失敗ログを検知する (メトリクス経路とは独立した保険)。
          # 除外パターン (False Positive 対策):
          # 1. systemd-journal-upload.service: 送信先 (LB / vmauth) の瞬断時に exit-code で終了し、
          #    Restart=always で即座に自動復旧するため除外する。
          # 2. serial-getty@ttyS0.service: シリアルデバイスを持たない VM で起動試行・失敗するため除外する。
          # 3. sshd-keygen.service: 初回起動時の鍵生成前後の過渡的な失敗を除外する。
          expr: |-
            _time:5m SYSLOG_IDENTIFIER:systemd "Failed with result"
              NOT UNIT:~"^(systemd-journal-upload|serial-getty@ttyS0|sshd-keygen)\\.service$"
            | rename _HOSTNAME as host, UNIT as unit, UNIT_RESULT as result
            | stats by (host, unit, result) count() as failures
            | filter failures:>0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }} の {{ $labels.unit }} が失敗した ({{ $labels.result }})"
            description: "ホスト {{ $labels.host }} で systemd ユニット {{ $labels.unit }} が Failed with result '{{ $labels.result }}' を出力した。"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: trivy-summary-rules
spec:
  groups:
    # この recording rule は 2 つのダッシュボードから参照される。
    # - 壁掛けダッシュボード (k8s/base/monitoring-pwa/grafana-dashboard-wall.yaml、uid nuage-wall)
    #   : nuage:trivy_image_vulnerabilities:dedup_by_image、nuage:trivy_resource_configaudits:dedup_by_workload
    # - Trivy ダッシュボード (k8s/trivy-operator/dashboards/trivy-operator.json、uid trivy-operator)
    #   : 上の 2 つと nuage:trivy_scan_target:by_workload (Scan Coverage 行・Vulnerabilities by Workload)。
    #     さらに Misconfiguration by Namespace の表は、nuage:trivy_resource_configaudits:dedup_by_workload の式を写し、
    #     Namespace ごとに分けて数えている (合計がこのルールと一致するように)。Vulnerabilities by Workload の表も、
    #     ReplicaSet の名前から pod-template-hash を除く正規表現と Argo CronWorkflow の Pod の命名パターンを写している。
    #     このルールの数え方や命名パターンを変えるときは、ダッシュボードの式も同じように直す。
    # ルール名・ラベル・数え方を変えるときは、両方のダッシュボードを合わせて直す。片方だけ直すと、もう一方のダッシュボードが黙って壊れる。
    # trivy-operator 本体 (k8s/trivy-operator) を更新してメトリクスのラベルが変わったときも、このルールを見直す。
    #
    # 壁掛けダッシュボード (uid nuage-wall) の「セキュリティ」欄で、現在の件数と前日比を出すための件数。
    # trivy-operator のメトリクスをそのまま合計すると、実態が変わらなくても日々件数が増えて前日比が意味をなさないため、数え直して記録する。
    # 評価間隔は vmalert の既定 (1m) に任せる。
    - name: trivy-summary
      rules:
        # PR 環境 (Namespace 名が <名前>-pr-<番号>、pechka-pr-84 など) は数えない。
        # PR の開閉で件数が跳ね (pechka の PR 環境 1 つで設定不備のレポートが約 31 件増える)、前日比が「昨日のこの時刻に PR 環境があったか」で決まってしまうため。
        # エラーログでも PR 環境は本番と分けている。
        # 脆弱性の件数 (severity ごと)。
        # trivy-operator はワークロードごとにレポートを作るため、同じイメージが複数のワークロードで重ねて数えられる
        # (argoexec ×11、config-reloader ×9 など)。終わった Pod (CronJob・Argo Workflows の Pod) のイメージも数えられ、
        # 何も変わらなくても日々件数が増える。trivy-operator 側にイメージ単位で数える設定は無いため、
        # イメージの digest 単位で重複を除いてから合計する。
        # alert: "" は CRD の既定値。省略すると実機との差分が残って Argo CD が OutOfSync のままになるため明示する
        - record: nuage:trivy_image_vulnerabilities:dedup_by_image
          alert: ""
          expr: |-
            sum by (severity) (
              max by (image_registry, image_repository, image_digest, severity) (
                trivy_image_vulnerabilities{job="trivy-operator",exported_namespace!~".+-pr-[0-9]+"}
              )
            )
        # 設定不備の件数 (severity ごと)。
        # trivy-operator は同じものを実行ごとに別名で何個もレポートする (Argo CronWorkflow の Pod は実行時刻を名前に含むため日ごとに増える。
        # Deployment の ReplicaSet はロールアウト中に新旧 2 個になる)。
        # そこで、実行ごとに変わる名前の部分を取り除いた workload にまとめ、同じ workload・severity は max で 1 つにして合計する。
        # 特定のジョブ名はルールに書かず、命名規則のパターンだけで判定する。
        # 「終わった Pod / Job を除く」方式は採らない。trivy は Argo の親リソースを調べないため、
        # Argo CronWorkflow の Pod は終わった時点で何も残らず検知が消える。
        # Argo CD の hook などで動く単発の Job も親が無く、終わると同じように検知が消える。
        # (Kubernetes の CronJob は trivy が CronJob 自体のレポートを作るので、子が消えても検知は残る。)
        # 名前の加工は該当する kind にだけ適用し、他の kind の名前を誤って削らない。
        #
        # まとめられる命名パターン:
        #   Pod (Argo CronWorkflow) : <名前>-<10 桁の実行時刻>-<ステップ名>-<数字> → <名前>-<ステップ名>
        #                             ステップ名を持たない <名前>-<10 桁の実行時刻>-<数字> → <名前>
        #   ReplicaSet              : <Deployment 名>-<pod-template-hash> → <Deployment 名>
        #   それ以外の kind (Job・Service など) : 名前が固定のものとしてそのまま数える
        # まとめられないもの:
        #   - generateName で手動投入した Argo Workflow の Pod (<名前><ランダム 5 文字>-<ステップ>-<数字>)。実行ごとに別名で数えられる
        #   - generateName を持つ Job
        #   - kube-system の static pod (kube-apiserver-<ノード名> など)。実際にノードごとに存在するもので、
        #     実行のたびに増えないため件数は安定する。あえてまとめない
        # 新しい命名パターンが現れたら、ここに足す。
        # kube-state-metrics には依存しない。
        # alert: "" は CRD の既定値。省略すると実機との差分が残って Argo CD が OutOfSync のままになるため明示する
        - record: nuage:trivy_resource_configaudits:dedup_by_workload
          alert: ""
          expr: |-
            sum by (severity) (
              max by (exported_namespace, resource_kind, workload, severity) (
                label_replace(
                  trivy_resource_configaudits{job="trivy-operator",exported_namespace!~".+-pr-[0-9]+",resource_kind!~"Pod|ReplicaSet"},
                  "workload", "$1", "resource_name", "(.*)"
                )
                or
                label_replace(
                  label_replace(
                    trivy_resource_configaudits{job="trivy-operator",exported_namespace!~".+-pr-[0-9]+",resource_kind="Pod"},
                    "workload", "$1", "resource_name", "(.*)"
                  ),
                  "workload", "$1$2", "resource_name", "(.+)-[0-9]{10}(-.+)?-[0-9]+"
                )
                or
                label_replace(
                  label_replace(
                    trivy_resource_configaudits{job="trivy-operator",exported_namespace!~".+-pr-[0-9]+",resource_kind="ReplicaSet"},
                    "workload", "$1", "resource_name", "(.*)"
                  ),
                  "workload", "$1", "resource_name", "(.+)-[bcdfghjklmnpqrstvwxz2456789]{6,10}"
                )
              )
            )
        # スキャン対象のワークロード (namespace・resource_kind・resource_name の組) を 1 件 1 系列で記録する。値は 1。
        # trivy-operator にはスキャンの進み具合を示すメトリクスが無いため、kube-state-metrics から対象を組み立て、
        # Trivy ダッシュボードの Scan Coverage 行で trivy_image_vulnerabilities の報告と 1 件ずつ突き合わせる。
        # 対象は vulnerabilityScannerScanOnlyCurrentRevisions: true (k8s/trivy-operator/kustomization.yaml) で trivy がスキャンする単位にそろえる。
        #   - レプリカ数が 1 以上の ReplicaSet (Deployment の古いリビジョンはスキャンされない)
        #   - レプリカ数が 1 以上の StatefulSet (0 レプリカには Pod が無くスキャンされない)
        #   - DaemonSet・CronJob
        #   - 親リソースの無い Job (owner_kind="")。ただし trivy-operator Namespace の Job は除く
        #   - Pod のうち、親の無いもの (owner_kind="")・static Pod (owner_kind="Node")・Argo の Workflow の Pod (owner_kind="Workflow")
        # kube-state-metrics は親の無いリソースに owner_kind ラベルを付けない (空になる)。"<none>" という値は出ないので空文字で一致させる。
        # trivy-operator Namespace の Job は trivy-operator 自身のスキャン Job (scan-vulnerabilityreport-<ハッシュ>、1 日 100 件以上) で、
        # 親を持たないが trivy はスキャンしない。含めるとスキャン中は常に未スキャンとして出るため除く。
        # 種類ごとに元のメトリクスの値 (レプリカ数・作成時刻など) が違うため、max ではなく group で値を 1 にそろえる。
        # trivy-operator の設定や対象の数え方を変えたら、この式も見直す。
        # PR 環境 (<名前>-pr-<番号> の Namespace) は対象から外す。含めると PR 環境ができるたびに未スキャンが増え、割合が下がって stat が黄色になる。
        # 同じダッシュボードの脆弱性・設定不備の件数 (上の 2 つのルール) も PR 環境を外して数えている。
        # 割合も同じ範囲で数えれば、「表示されている件数のうち、スキャンの済んでいないものがどれだけあるか」を示す数字になる。
        # alert: "" は CRD の既定値。省略すると実機との差分が残って Argo CD が OutOfSync のままになるため明示する
        - record: nuage:trivy_scan_target:by_workload
          alert: ""
          expr: |-
            group by (namespace, resource_kind, resource_name) (
              label_replace(label_replace(kube_replicaset_spec_replicas{namespace!~".+-pr-[0-9]+"} > 0, "resource_name", "$1", "replicaset", "(.+)"), "resource_kind", "ReplicaSet", "", "")
              or label_replace(label_replace(kube_statefulset_replicas{namespace!~".+-pr-[0-9]+"} > 0, "resource_name", "$1", "statefulset", "(.+)"), "resource_kind", "StatefulSet", "", "")
              or label_replace(label_replace(kube_daemonset_created{namespace!~".+-pr-[0-9]+"}, "resource_name", "$1", "daemonset", "(.+)"), "resource_kind", "DaemonSet", "", "")
              or label_replace(label_replace(kube_cronjob_created{namespace!~".+-pr-[0-9]+"}, "resource_name", "$1", "cronjob", "(.+)"), "resource_kind", "CronJob", "", "")
              or label_replace(label_replace(kube_job_owner{owner_kind="",namespace!="trivy-operator",namespace!~".+-pr-[0-9]+"}, "resource_name", "$1", "job_name", "(.+)"), "resource_kind", "Job", "", "")
              or label_replace(label_replace(kube_pod_owner{owner_kind=~"|Node|Workflow",namespace!~".+-pr-[0-9]+"}, "resource_name", "$1", "pod", "(.+)"), "resource_kind", "Pod", "", "")
            )
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: repo-scan-rules
spec:
  groups:
    - name: repo-scan
      rules:
        # リポジトリのスキャン (k8s/repo-scan の CronJob、毎日 日本時間 4:00) は、リポジトリごとに
        #   - nuage_repo_scan_target{repo}: 対象であること (実行のたびにすべての対象について 1 を送る)
        #   - nuage_repo_scan_last_success_timestamp_seconds{repo}: クローンと trivy・semgrep の両方が成功した時刻 (成功したときだけ送る)
        # を vmagent に送る。1 日 1 回しか値が来ないため、last_over_time で最新の値を取る。
        # 次のどちらかで鳴らす。
        #   1. 対象なのに、成功時刻が 36 時間より古い、または一度も成功していない (成功時刻の値が無い) リポジトリがある。
        #      対象から外したリポジトリは nuage_repo_scan_target が来なくなり、36 時間で鳴らなくなる
        #   2. CronJob が 36 時間 1 度も送ってきていない (動いていない・送信に失敗している)。repo ラベルは付かない
        # 36 時間は、毎日の実行が 1 回失敗しても次の実行までに直れば鳴らない長さ (24 時間 + 余裕)。
        # for: 1h は、マージ直後に初回の実行 (手動で 1 回動かす) を済ませるまでの間に 2 が鳴らないようにするため。
        # record: "" は CRD の既定値。省略すると実機との差分が残って Argo CD が OutOfSync のままになるため明示する
        - alert: RepoScanNotSucceeded
          record: ""
          annotations:
            summary: "リポジトリのスキャンが 36 時間以上成功していない ({{ $labels.repo }})"
            description: "repo-scan Namespace の CronJob repo-scan で、リポジトリ {{ $labels.repo }} のクローンまたはスキャン (trivy・semgrep) が 36 時間以上成功していない (repo が空なら、CronJob が 36 時間 1 度も件数を送っていない)。kubectl -n repo-scan get jobs と、VictoriaLogs の kubernetes.pod_namespace:=\"repo-scan\" event:=\"repo_status\" のログで原因を確かめること。"
          expr: |-
            (
              max by (repo) (last_over_time(nuage_repo_scan_target[36h]))
              unless on (repo)
              (time() - max by (repo) (last_over_time(nuage_repo_scan_last_success_timestamp_seconds[36h])) < 36 * 3600)
            )
            or
            absent_over_time(nuage_repo_scan_target[36h])
          for: 1h
          labels:
            severity: warning
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: honeytrap-rules
spec:
  groups:
    - name: honeytrap-rules
      type: vlogs
      interval: 1m
      rules:
        # 通常アクセスが 0 のハニーポットのため、1 件でもログが記録されたら誤検知ゼロとみなし即座に critical で発報する。
        # _time:15m は、攻撃検知後に壁掛けモニターや通知で 15 分間 critical を維持し、最後の攻撃から 15 分で自動 resolved させるため
        # record: "" は CRD の既定値。省略すると実機との差分が残って Argo CD が OutOfSync のままになるため明示する
        - alert: HoneypotIntrusionDetected
          record: ""
          expr: |-
            _time:15m kubernetes.pod_namespace:="nuage-honeytrap" event:="honeypot_attack"
            | stats by (src_ip, protocol, dst_port, service) count() as attacks
            | filter attacks:>0
          labels:
            severity: critical
          annotations:
            summary: "🚨 ハニーポット侵入検知 (protocol={{ $labels.protocol }})"
            description: "過去15分以内に攻撃元={{ $labels.src_ip }} から {{ $labels.service }} (port {{ $labels.dst_port }}) への攻撃試行を検知。"
            runbook_url: "https://monitoring.wpcapp.net/grafana/d/nuage-honeytrap"
