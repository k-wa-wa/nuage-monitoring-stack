# クラスタ外の NixOS ホストの node-exporter。
# TODO:
# - 追加したホスト (swfs-cluster-1/2/3, mainframe, atelier, lm-server, bluray-extractor, chaos-monitor) の勘定を nuage-usage-ledger の mvs/cntl/ACCTDEF に登録する
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: external-nodes
spec:
  jobName: external-nodes
  targetEndpoints:
    - targets:
        - 10.20.1.21:9100
        - 10.20.1.22:9100
        - 10.20.1.23:9100
      labels:
        role: loadbalancer
      interval: 30s
    - targets:
        - 10.20.1.30:9100
      labels:
        role: egress-gateway
      interval: 30s
    - targets:
        - 10.20.1.41:9100
        - 10.20.1.42:9100
        - 10.20.1.43:9100
      labels:
        role: postgres-cluster
      interval: 30s
    - targets:
        - 10.20.1.52:9100
      labels:
        role: atelier
      interval: 30s
    - targets:
        - 10.20.1.61:9100
        - 10.20.1.62:9100
        - 10.20.1.63:9100
      labels:
        role: swfs-cluster
      interval: 30s
    - targets:
        - 10.20.1.80:9100
      labels:
        role: bluray-extractor
      interval: 30s
    - targets:
        - 10.20.1.90:9100
      labels:
        role: mainframe
      interval: 30s
    - targets:
        - 10.20.1.250:9100
      labels:
        role: chaos-monitor
      interval: 30s
    - targets:
        - 192.168.5.222:9100
      labels:
        role: lm-server
      interval: 30s
