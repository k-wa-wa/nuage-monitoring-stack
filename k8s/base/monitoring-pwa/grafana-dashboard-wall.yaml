# 家の常設モニターにずっと表示しておく壁掛けダッシュボード。
# 約 3m 離れて見ても、リソースの使用状況とアラートの状態が色で「正常か異常か」わかることを狙う。
# しきい値の判断はアラートに任せ、細かい数字は出さない。
# 1920x1080 の横置き・kiosk モード (?kiosk&theme=dark) で縦スクロールが出ないよう、grid は 27 行に収める。
#
# エラーログの判定は、アプリのログレベルが未定義のため当面「"error" を含む行 (大文字小文字無視)」とする。
# ログレベルが決まったら「本番のエラー」「PR 環境のエラー」「最新のエラーログ」のクエリを差し替える。
#
# 一番下の行の右端は「セキュリティ」欄で、trivy-operator の脆弱性・設定不備 (Critical / High) の現在の件数と前日比を出す。
# 件数は k8s/base/victoria/rules.yaml の trivy-summary-rules で数え直した値を使う (同じイメージの重複・終わった Pod を除く)。
#
# 「最新のエラーログ」では NixOS ホストの journal の PRIORITY 0-3 から sshd と dbus-broker-launch を除いている。
# TODO:
# - sshd / dbus-broker-launch のエラーが本当に無害かを調査する
# - bluray-extractor の agetty が 1 日 8000 件以上のエラーを出している原因を調査する
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-wall
  labels:
    grafana_dashboard: "1"
data:
  wall.json: |
    {
      "title": "壁掛けモニター",
      "uid": "nuage-wall",
      "tags": [
        "nuage",
        "wall"
      ],
      "timezone": "Asia/Tokyo",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "全体の状態",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "max(\n    (ALERTS{alertstate=\"firing\",severity=\"critical\",alertname!~\"Watchdog|InfoInhibitor\"} * 0 + 3)\n  or (ALERTS{alertstate=\"firing\",severity=\"warning\",alertname!~\"Watchdog|InfoInhibitor\"} * 0 + 2)\n  or vector(1)\n) and on () (count(ALERTS{alertstate=\"firing\",alertname=\"Watchdog\"}) > 0)\nor vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6e6e6e",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "監視停止",
                      "color": "#6e6e6e",
                      "index": 0
                    },
                    "1": {
                      "text": "正常",
                      "color": "green",
                      "index": 1
                    },
                    "2": {
                      "text": "警告",
                      "color": "yellow",
                      "index": 2
                    },
                    "3": {
                      "text": "危険",
                      "color": "red",
                      "index": 3
                    }
                  }
                }
              ],
              "noValue": "監視停止"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "発火中アラートの最も重い重要度 (Watchdog / InfoInhibitor を除く。info は正常扱い)。Watchdog が firing で届いていないときは vmalert が止まっているとみなし「監視停止」とする。"
        },
        {
          "id": 2,
          "type": "stat",
          "title": "危険 (critical)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\",alertname!~\"Watchdog|InfoInhibitor\"})\n  and on () (count(ALERTS{alertstate=\"firing\",alertname=\"Watchdog\"}) > 0)\nor (0 * count(ALERTS{alertstate=\"firing\",alertname=\"Watchdog\"}))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "noValue": "監視停止"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "severity=critical の発火件数 (Watchdog / InfoInhibitor を除く)。Watchdog が届いていないときは件数を出さず値なし (監視停止) とする。"
        },
        {
          "id": 3,
          "type": "stat",
          "title": "警告 (warning)",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"warning\",alertname!~\"Watchdog|InfoInhibitor\"})\n  and on () (count(ALERTS{alertstate=\"firing\",alertname=\"Watchdog\"}) > 0)\nor (0 * count(ALERTS{alertstate=\"firing\",alertname=\"Watchdog\"}))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "noValue": "監視停止"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "severity=warning の発火件数 (Watchdog / InfoInhibitor を除く)。Watchdog が届いていないときは件数を出さず値なし (監視停止) とする。"
        },
        {
          "id": 4,
          "type": "grafana-clock-panel",
          "title": "",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "transparent": true,
          "options": {
            "mode": "time",
            "clockType": "24 hour",
            "refresh": "sec",
            "timezone": "Asia/Tokyo",
            "fontMono": true,
            "timeSettings": {
              "fontSize": "44px",
              "fontWeight": "bold"
            },
            "dateSettings": {
              "showDate": true,
              "dateFormat": "YYYY-MM-DD (ddd)",
              "locale": "ja",
              "fontSize": "18px",
              "fontWeight": "normal"
            },
            "timezoneSettings": {
              "showTimezone": false,
              "zoneFormat": "offsetAbbv",
              "fontSize": "12px",
              "fontWeight": "normal"
            }
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "発火中のアラート",
          "description": "重い順。経過時間は ALERTS_FOR_STATE (アラートが active になった時刻) から算出する。",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "WITH (\n  firing = ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"},\n  elapsed = time() - (ALERTS_FOR_STATE and ignoring (alertstate) firing),\n  joined = label_join(elapsed, \"target\", \"/\", \"namespace\", \"pod\", \"host\", \"node\", \"instance\", \"name\", \"job_name\"),\n  target = label_replace(label_transform(joined, \"target\", \"/{2,}\", \"/\"), \"target\", \"$1\", \"target\", \"/*(.*?)/*\"),\n  ranked = label_replace(label_replace(label_replace(target,\n    \"rank\", \"1\", \"severity\", \"critical\"),\n    \"rank\", \"2\", \"severity\", \"warning\"),\n    \"rank\", \"3\", \"severity\", \"info\")\n)\nranked",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "rank"
                  }
                ]
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "severity",
                    "alertname",
                    "target",
                    "Value",
                    "Value #A"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "severity": 0,
                  "alertname": 1,
                  "target": 2,
                  "Value": 3,
                  "Value #A": 3
                },
                "renameByName": {
                  "severity": "重要度",
                  "alertname": "アラート",
                  "target": "対象",
                  "Value": "経過",
                  "Value #A": "経過"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "発火中のアラートはない",
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "重要度"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "critical": {
                            "text": "危険",
                            "color": "red",
                            "index": 0
                          },
                          "warning": {
                            "text": "警告",
                            "color": "yellow",
                            "index": 1
                          },
                          "info": {
                            "text": "情報",
                            "color": "blue",
                            "index": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "経過"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dtdurations"
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Node Ready (k8s)",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 6
                  }
                ]
              },
              "mappings": [],
              "noValue": "取得不可"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "Ready の k8s ノード数。6 台未満で赤。"
        },
        {
          "id": 7,
          "type": "stat",
          "title": "異常 Pod",
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "count(\n     (max by (namespace, pod) (kube_pod_status_phase{phase=~\"Pending|Unknown|Failed\"} == 1)\n        and on (namespace, pod) max by (namespace, pod) (kube_pod_owner{owner_kind!~\"Job|Workflow\"}))\n  or max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError\"} == 1)\n)\nor (0 * max(up{job=\"kube-state-metrics\"} == 1))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "noValue": "取得不可"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "Pending / Unknown / Failed (Job・Workflow の Pod を除く) と、CrashLoopBackOff などで待機中の Pod の数。"
        },
        {
          "id": 8,
          "type": "stat",
          "title": "CPU (全ノード平均)",
          "gridPos": {
            "x": 20,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "avg(100 - avg by (instance) (rate(node_cpu_seconds_total{job=~\"node-exporter|external-nodes\",mode=\"idle\"}[5m])) * 100)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "mappings": [],
              "noValue": "取得不可",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "17 ノードの CPU 使用率の平均。"
        },
        {
          "id": 9,
          "type": "stat",
          "title": "メモリ (全ノード平均)",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "avg(100 * (1 - node_memory_MemAvailable_bytes{job=~\"node-exporter|external-nodes\"} / node_memory_MemTotal_bytes{job=~\"node-exporter|external-nodes\"}))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "mappings": [],
              "noValue": "取得不可",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "17 ノードのメモリ使用率の平均。"
        },
        {
          "id": 10,
          "type": "stat",
          "title": "VM 保存先 a の空き",
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "max(vm_free_disk_space_bytes{job=\"vmsingle-vm\",path=\"/victoria-metrics-data\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 25000000000.0
                  },
                  {
                    "color": "green",
                    "value": 30000000000.0
                  }
                ]
              },
              "mappings": [],
              "noValue": "取得不可",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false
          },
          "description": "storage.minFreeDiskSpaceBytes (20GB) を下回ると書き込みが止まる。25GB 未満で赤。"
        },
        {
          "id": 11,
          "type": "stat",
          "title": "VM 保存先 b の空き",
          "gridPos": {
            "x": 20,
            "y": 7,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "max(vm_free_disk_space_bytes{job=\"vmsingle-vm-b\",path=\"/victoria-metrics-data\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 25000000000.0
                  },
                  {
                    "color": "green",
                    "value": 30000000000.0
                  }
                ]
              },
