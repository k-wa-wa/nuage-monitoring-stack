apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-honeytrap
  labels:
    grafana_dashboard: "1"
data:
  honeytrap.json: |
    {
      "title": "侵入検知ハニーポット (nuage-honeytrap)",
      "uid": "nuage-honeytrap",
      "tags": [
        "nuage",
        "security",
        "honeytrap"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "総攻撃試行数",
          "description": "選択期間内にハニーポットで検知された総攻撃試行回数。",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | stats count() as total",
              "queryType": "stats",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "攻撃元 IP 数",
          "description": "選択期間内にハニーポットへアクセスを試みたユニーク IP アドレス数。",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | stats count_uniq(src_ip) as ips",
              "queryType": "stats",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "bargauge",
          "title": "プロトコル別攻撃割合",
          "description": "選択期間内のプロトコル（SSH, HTTP, PostgreSQL 等）別の攻撃検知回数。",
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | stats by (protocol) count() as count",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{protocol}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "noValue": "0",
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "攻撃発生タイムライン",
          "description": "選択期間内のプロトコル別攻撃発生推移。",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | stats by (protocol) count() as count",
              "queryType": "statsRange",
              "editorMode": "code",
              "legendFormat": "{{protocol}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "sum",
                "max"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "最新攻撃インシデント一覧",
          "description": "選択期間内に検知された攻撃インシデントの一覧（最新順）。",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\"\n| replace_regexp (\".+\", \"***\") at details.password\n| pack_json fields (details.*) as details\n| fields _time, protocol, src_ip, dst_port, service, details\n| sort by (_time desc)\n| limit 50",
              "queryType": "instant",
              "editorMode": "code"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "format": "auto",
                "source": "labels"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Line": true,
                  "labels": true
                },
                "indexByName": {
                  "Time": 0,
                  "_time": 0,
                  "protocol": 1,
                  "src_ip": 2,
                  "dst_port": 3,
                  "service": 4,
                  "details": 5
                },
                "renameByName": {
                  "Time": "時刻",
                  "_time": "時刻",
                  "protocol": "プロトコル",
                  "src_ip": "攻撃元 IP",
                  "dst_port": "公開ポート",
                  "service": "サービス",
                  "details": "詳細"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "時刻"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 180
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "プロトコル"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 110
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "ssh": {
                            "color": "orange",
                            "index": 0,
                            "text": "SSH"
                          },
                          "http": {
                            "color": "blue",
                            "index": 1,
                            "text": "HTTP"
                          },
                          "postgres": {
                            "color": "purple",
                            "index": 2,
                            "text": "PostgreSQL"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "攻撃元 IP"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "公開ポート"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "サービス"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 160
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "詳細"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          }
        }
      ]
    }
