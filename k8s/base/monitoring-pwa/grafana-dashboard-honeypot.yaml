artsLib.getMap) {\n  throw new Error('context.echarts が無い。Business Charts のバージョンを確認すること');\n}\nif (!echartsLib.getMap('world_pacific')) {\n  const world = echartsLib.getMap('world');\n  if (!world || !world.geoJson) {\n    throw new Error(\"地図 'world' が登録されていない。パネルの Map 設定が JSON になっているか確認すること\");\n  }\n  const shiftPolygon = (rings) => {\n    const outer = rings[0];\n    const meanLon = outer.reduce((sum, c) => sum + c[0], 0) / outer.length;\n    if (meanLon >= PACIFIC_SEAM_LON) return rings;\n    return rings.map(ring => ring.map(c => [c[0] + 360, c[1]]));\n  };\n  const features = world.geoJson.features\n    .filter(f => f.properties && f.properties.name !== 'Antarctica')\n    .map(f => {\n      const g = f.geometry;\n      const coordinates = g.type === 'MultiPolygon'\n        ? g.coordinates.map(shiftPolygon)\n        : g.type === 'Polygon' ? shiftPolygon(g.coordinates) : g.coordinates;\n      return { ...f, geometry: { ...g, coordinates } };\n    });\n  echartsLib.registerMap('world_pacific', { type: 'FeatureCollection', features });\n}\n\n// Grafana データフレームから全 series を安全に取得\nconst seriesList = (context && context.panel && context.panel.data && context.panel.data.series) || (typeof data !== 'undefined' && data && data.series) || [];\n\n// 国コードごとの集計マップ\nconst countryCounts = {};\n// 国コード -> 日本語名 (details.country_ja。付与前の古いログや未登録コードでは無い)\nconst countryNames = {};\n// 地図未配置の国と件数 (Tor, XX, 辞書未登録コード)\nconst unmappedCounts = {};\nlet unmappedTotal = 0;\n\nfor (const s of seriesList) {\n  if (!s || !s.fields) continue;\n\n  // パターン 1: 系列ラベルに国コードが含まれる場合 (stats クエリの標準形式)\n  let labelCountry = '';\n  let labelCountryJa = '';\n  for (const f of s.fields) {\n    if (f.labels) {\n      if (f.labels['details.country']) {\n        labelCountry = f.labels['details.country'];\n        labelCountryJa = f.labels['details.country_ja'] || '';\n        break;\n      }\n      if (f.labels['country']) {\n        labelCountry = f.labels['country'];\n        labelCountryJa = f.labels['country_ja'] || '';\n        break;\n      }\n    }\n  }\n\n  if (labelCountry) {\n    const numField = s.fields.find(f => f.type === 'number') || s.fields[0];\n    if (numField) {\n      const vals = numField.values.buffer || numField.values || [];\n      const val = Number(vals[vals.length - 1]) || 0;\n      if (val > 0) {\n        const code = String(labelCountry).trim().toUpperCase();\n        countryCounts[code] = (countryCounts[code] || 0) + val;\n        if (labelCountryJa) {\n          countryNames[code] = String(labelCountryJa);\n        }\n      }\n    }\n    continue;\n  }\n\n  // パターン 2: 表形式（1フレーム内に国列と値列が存在する場合）\n  const strField = s.fields.find(f => f.name === 'details.country' || f.name === 'country' || f.type === 'string');\n  const jaField = s.fields.find(f => f.name === 'details.country_ja' || f.name === 'country_ja');\n  const numField = s.fields.find(f => (f.name === 'count' || f.name === 'count()' || f.type === 'number') && f.name !== 'Time' && f.name !== '_time');\n\n  if (strField && numField) {\n    const countries = strField.values.buffer || strField.values || [];\n    const counts = numField.values.buffer || numField.values || [];\n    const names = jaField ? (jaField.values.buffer || jaField.values || []) : [];\n    const len = Math.min(countries.length, counts.length);\n    for (let i = 0; i < len; i++) {\n      const code = String(countries[i] || '').trim().toUpperCase();\n      const val = Number(counts[i]) || 0;\n      if (code && val > 0) {\n        countryCounts[code] = (countryCounts[code] || 0) + val;\n        if (names[i]) {\n          countryNames[code] = String(names[i]);\n        }\n      }\n    }\n  }\n}\n\n// 表示名: 日本語名があれば「日本 (JP)」、無ければ国コードのみ\nconst displayName = (code) => countryNames[code] ? `${countryNames[code]} (${code})` : code;\n\n// アーク線とマーカーの構築\nconst attackItems = [];\nlet maxCount = 1;\n\nfor (const [code, cnt] of Object.entries(countryCounts)) {\n  if (countryCoords[code]) {\n    attackItems.push({\n      country: code,\n      count: cnt,\n      coord: toPacific(countryCoords[code])\n    });\n    if (cnt > maxCount) {\n      maxCount = cnt;\n    }\n  } else {\n    // 位置を決められない国コード (T1, XX, UM 等) を集計\n    unmappedCounts[code] = (unmappedCounts[code] || 0) + cnt;\n    unmappedTotal += cnt;\n  }\n}\n\n// アーク線データと攻撃元点データの構築\nconst lineData = [];\nconst sourcePointData = [];\n\nfor (const item of attackItems) {\n  // 攻撃件数に応じた線の太さスケーリング (min 1.5, max 7)\n  const normalized = Math.log10(item.count + 1) / Math.log10(maxCount + 10);\n  const lineWidth = Math.max(1.5, Math.min(7, 1 + normalized * 6));\n\n  // curveness は進行方向に対して曲がる向きが決まるため、そのままだと西から来る線は山なり、\n  // 東 (アメリカ等) から来る線は谷なりになる。東から来る線は符号を反転して山なりにそろえる\n  const curveness = item.coord[0] > TOKYO_COORD[0] ? -0.25 : 0.25;\n\n  lineData.push({\n    fromName: displayName(item.country),\n    toName: 'Nuage Tokyo',\n    coords: [item.coord, TOKYO_COORD],\n    value: item.count,\n    lineStyle: {\n      width: lineWidth,\n      curveness\n    }\n  });\n\n  sourcePointData.push({\n    name: item.country,\n    value: [item.coord[0], item.coord[1], item.count]\n  });\n}\n\n// 地図に置けない攻撃の注記テキスト (エラーではないので目立たない色にする)\nlet subtitle = '';\nif (unmappedTotal > 0) {\n  const details = Object.entries(unmappedCounts)\n    .sort((a, b) => b[1] - a[1])\n    .map(([k, v]) => `${displayName(k)}:${v}`)\n    .join(', ');\n  subtitle = `※位置不明のため地図外: 計 ${unmappedTotal.toLocaleString()} 件 (${details})`;\n}\n\nreturn {\n  backgroundColor: 'transparent',\n  title: subtitle ? {\n    subtext: subtitle,\n    left: 10,\n    bottom: 8,\n    subtextStyle: {\n      color: '#8b949e',\n      fontSize: 11\n    }\n  } : undefined,\n  tooltip: {\n    trigger: 'item',\n    backgroundColor: 'rgba(20, 24, 33, 0.9)',\n    borderColor: '#303846',\n    textStyle: {\n      color: '#e6edf3'\n    },\n    formatter: function (params) {\n      if (params.seriesType === 'lines') {\n        return `<div style=\"font-weight:bold;margin-bottom:4px;\">通信アーク</div>` +\n               `送信元: <b>${params.data.fromName}</b><br/>` +\n               `着信先: <b>${params.data.toName}</b><br/>` +\n               `通信件数: <b style=\"color:#ff4d4f;\">${params.data.value.toLocaleString()}</b> 回`;\n      }\n      if (params.seriesType === 'effectScatter') {\n        if (params.data.name === 'Nuage Cluster (Tokyo)') {\n          return `<b>${params.data.name}</b><br/>Nuage Kubernetes Cluster 標的受信拠点`;\n        }\n        return `通信元: <b>${displayName(params.data.name)}</b><br/>通信件数: <b style=\"color:#ff4d4f;\">${params.data.value[2]?.toLocaleString()}</b> 回`;\n      }\n      return params.name;\n    }\n  },\n  geo: {\n    map: 'world_pacific',\n    roam: true,\n    zoom: 1,\n    center: [TOKYO_COORD[0], 20],\n    label: {\n      show: false,\n      emphasis: {\n        show: false\n      }\n    },\n    itemStyle: {\n      areaColor: '#1a1f2c',\n      borderColor: '#303846',\n      borderWidth: 0.8\n    },\n    emphasis: {\n      itemStyle: {\n        areaColor: '#273142'\n      }\n    }\n  },\n  series: [\n    {\n      name: 'Traffic Lines',\n      type: 'lines',\n      coordinateSystem: 'geo',\n      zlevel: 2,\n      effect: {\n        show: true,\n        period: 6,\n        trailLength: 0.7,\n        color: '#ff4d4f',\n        symbolSize: 3\n      },\n      lineStyle: {\n        color: '#ff4d4f',\n        opacity: 0.55,\n        curveness: 0.25\n      },\n      data: lineData\n    },\n    {\n      name: 'Nuage Cluster',\n      type: 'effectScatter',\n      coordinateSystem: 'geo',\n      zlevel: 3,\n      rippleEffect: {\n        brushType: 'stroke',\n        scale: 4,\n        period: 4\n      },\n      label: {\n        show: true,\n        position: 'right',\n        formatter: '{b}',\n        color: '#00e676',\n        fontSize: 11,\n        fontWeight: 'bold'\n      },\n      itemStyle: {\n        color: '#00e676',\n        shadowBlur: 10,\n        shadowColor: '#00e676'\n      },\n      data: [\n        {\n          name: 'Nuage Cluster (Tokyo)',\n          value: [TOKYO_COORD[0], TOKYO_COORD[1]]\n        }\n      ]\n    },\n    {\n      name: 'Source Countries',\n      type: 'effectScatter',\n      coordinateSystem: 'geo',\n      zlevel: 3,\n      rippleEffect: {\n        brushType: 'stroke',\n        scale: 3,\n        period: 5\n      },\n      label: {\n        show: true,\n        position: 'top',\n        formatter: '{b}',\n        color: '#ff7875',\n        fontSize: 10\n      },\n      itemStyle: {\n        color: '#ff4d4f',\n        shadowBlur: 6,\n        shadowColor: '#ff4d4f'\n      },\n      data: sourcePointData\n    }\n  ]\n};"
          }
        },
