apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-honeypot
  labels:
    grafana_dashboard: "1"
data:
  honeypot-attack-map.json: |
    {
      "title": "Honeytrap Attack Map & Analytics",
      "uid": "nuage-honeytrap-attack-map",
      "tags": [
        "nuage",
        "security",
        "honeytrap"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "volkovlabs-echarts-panel",
          "title": "Cyber Attack Map (全世界 → Nuage Tokyo)",
          "description": "nuage-honeytrap が検知した攻撃元国から東京（Nuage Cluster）への攻撃アーク線。線の太さは攻撃試行回数に比例（対数スケール）。※国コードは Cloudflare 経由の HTTP 攻撃のみ付与されます（SSH/PostgreSQL 接続は含まれません）。",
          "gridPos": {
            "h": 14,
            "w": 16,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | filter details.country:!=\"\" | stats by (details.country) count() as count | sort by (count desc, details.country asc)",
              "queryType": "stats",
              "editorMode": "code"
            }
          ],
          "options": {
            "renderer": "canvas",
            "editor": {
              "format": "auto"
            },
            "map": "json",
            "getOption": "// 代表座標辞書 (ISO 3166-1 alpha-2 -> [経度, 緯度])\nconst countryCoords = {\n  JP: [139.6917, 35.6895], // 日本 (Tokyo)\n  US: [-95.7129, 37.0902], // アメリカ\n  CN: [104.1954, 35.8617], // 中国\n  RU: [105.3188, 61.5240], // ロシア\n  DE: [10.4515, 51.1657],  // ドイツ\n  GB: [-3.4360, 55.3781],  // イギリス\n  FR: [2.2137, 46.2276],   // フランス\n  IN: [78.9629, 20.5937],  // インド\n  BR: [-51.9253, -14.2350],// ブラジル\n  SG: [103.8198, 1.3521],  // シンガポール\n  NL: [5.2913, 52.1326],   // オランダ\n  CA: [-106.3468, 56.1304],// カナダ\n  VN: [108.2772, 14.0583], // ベトナム\n  KR: [127.7669, 35.9078], // 韓国\n  AU: [133.7751, -25.2744],// オーストラリア\n  TW: [120.9605, 23.6978], // 台湾\n  HK: [114.1694, 22.3193], // 香港\n  UA: [31.1656, 48.3794],  // ウクライナ\n  PL: [19.1451, 51.9194],  // ポーランド\n  IT: [12.5674, 41.8719],  // イタリア\n  ES: [-3.7492, 40.4637],  // スペイン\n  SE: [18.6435, 60.1282],  // スウェーデン\n  CH: [8.2275, 46.8182],   // スイス\n  RO: [24.9668, 45.9432],  // ルーマニア\n  BG: [25.4858, 42.7339],  // ブルガリア\n  IR: [53.6880, 32.4279],  // イラン\n  TR: [35.2433, 38.9637],  // トルコ\n  IL: [34.8516, 31.0461],  // イスラエル\n  ID: [113.9213, -0.7893], // インドネシア\n  TH: [100.9925, 15.8700], // タイ\n  MY: [101.9758, 4.2105],  // マレーシア\n  PH: [121.7740, 12.8797], // フィリピン\n  PK: [69.3451, 30.3753],  // パキスタン\n  BD: [90.3563, 23.6850],  // バングラデシュ\n  ZA: [22.9375, -30.5595], // 南アフリカ\n  EG: [30.8025, 26.8206],  // エジプト\n  NG: [8.6753, 9.0820],    // ナイジェリア\n  KE: [37.9062, -0.0236],  // ケニア\n  MX: [-102.5528, 23.6345],// メキシコ\n  AR: [-63.6167, -38.4161],// アルゼンチン\n  CL: [-71.5430, -35.6751],// チリ\n  CO: [-74.2973, 4.5709],  // コロンビア\n  FI: [25.7482, 61.9241],  // フィンランド\n  NO: [8.4689, 60.4720],   // ノルウェー\n  DK: [9.5018, 56.2639],   // デンマーク\n  AT: [14.5501, 47.5162],  // オーストリア\n  BE: [4.4699, 50.5039],   // ベルギー\n  CZ: [15.4730, 49.8175],  // チェコ\n  HU: [19.5033, 47.1625],  // ハンガリー\n  PT: [-8.2245, 39.3999],  // ポルトガル\n  GR: [21.8243, 39.0742],  // ギリシャ\n  IE: [-8.2439, 53.4129],  // アイルランド\n  NZ: [174.8860, -40.9006],// ニュージーランド\n  SA: [45.0792, 23.8859],  // サウジアラビア\n  AE: [53.8478, 23.4241],  // UAE\n  KZ: [66.9237, 48.0196],  // カザフスタン\n  UZ: [64.5853, 41.3775],  // ウズベキスタン\n  LT: [23.8813, 55.1694],  // リトアニア\n  LV: [24.6032, 56.9496],  // ラトビア\n  EE: [25.0136, 58.5953],  // エストニア\n  MD: [28.3699, 47.4116],  // モルドバ\n  RS: [21.0059, 44.0165]   // セルビア\n};\n\n// 東京 (Nuage Cluster) の座標 (東経139.76, 北緯35.68)\nconst TOKYO_COORD = [139.76, 35.68];\n\n// Grafana データフレームから全 series を安全に取得\nconst seriesList = (context && context.panel && context.panel.data && context.panel.data.series) || (typeof data !== 'undefined' && data && data.series) || [];\n\n// 国コードごとの集計マップ\nconst countryCounts = {};\n// 地図未配置の国と件数 (Tor, XX, 辞書未登録コード)\nconst unmappedCounts = {};\nlet unmappedTotal = 0;\n\nfor (const s of seriesList) {\n  if (!s || !s.fields) continue;\n\n  // パターン 1: 系列ラベルに国コードが含まれる場合 (stats クエリの標準形式)\n  let labelCountry = '';\n  for (const f of s.fields) {\n    if (f.labels) {\n      if (f.labels['details.country']) {\n        labelCountry = f.labels['details.country'];\n        break;\n      }\n      if (f.labels['country']) {\n        labelCountry = f.labels['country'];\n        break;\n      }\n    }\n  }\n\n  if (labelCountry) {\n    const numField = s.fields.find(f => f.type === 'number') || s.fields[0];\n    if (numField) {\n      const vals = numField.values.buffer || numField.values || [];\n      const val = Number(vals[vals.length - 1]) || 0;\n      if (val > 0) {\n        const code = String(labelCountry).trim().toUpperCase();\n        countryCounts[code] = (countryCounts[code] || 0) + val;\n      }\n    }\n    continue;\n  }\n\n  // パターン 2: 表形式（1フレーム内に国列と値列が存在する場合）\n  const strField = s.fields.find(f => f.name === 'details.country' || f.name === 'country' || f.type === 'string');\n  const numField = s.fields.find(f => (f.name === 'count' || f.name === 'count()' || f.type === 'number') && f.name !== 'Time' && f.name !== '_time');\n\n  if (strField && numField) {\n    const countries = strField.values.buffer || strField.values || [];\n    const counts = numField.values.buffer || numField.values || [];\n    const len = Math.min(countries.length, counts.length);\n    for (let i = 0; i < len; i++) {\n      const code = String(countries[i] || '').trim().toUpperCase();\n      const val = Number(counts[i]) || 0;\n      if (code && val > 0) {\n        countryCounts[code] = (countryCounts[code] || 0) + val;\n      }\n    }\n  }\n}\n\n// アーク線とマーカーの構築\nconst attackItems = [];\nlet maxCount = 1;\n\nfor (const [code, cnt] of Object.entries(countryCounts)) {\n  if (countryCoords[code]) {\n    attackItems.push({\n      country: code,\n      count: cnt,\n      coord: countryCoords[code]\n    });\n    if (cnt > maxCount) {\n      maxCount = cnt;\n    }\n  } else {\n    // 辞書に未登録の国コード (XX, T1 等) を集計\n    unmappedCounts[code] = (unmappedCounts[code] || 0) + cnt;\n    unmappedTotal += cnt;\n  }\n}\n\n// アーク線データと攻撃元点データの構築\nconst lineData = [];\nconst sourcePointData = [];\n\nfor (const item of attackItems) {\n  // 攻撃件数に応じた線の太さスケーリング (min 1.5, max 7)\n  const normalized = Math.log10(item.count + 1) / Math.log10(maxCount + 10);\n  const lineWidth = Math.max(1.5, Math.min(7, 1 + normalized * 6));\n\n  lineData.push({\n    fromName: item.country,\n    toName: 'Nuage Tokyo',\n    coords: [item.coord, TOKYO_COORD],\n    value: item.count,\n    lineStyle: {\n      width: lineWidth\n    }\n  });\n\n  sourcePointData.push({\n    name: item.country,\n    value: [item.coord[0], item.coord[1], item.count]\n  });\n}\n\n// 未マッピング国の注記テキスト\nlet subtitle = '';\nif (unmappedTotal > 0) {\n  const details = Object.entries(unmappedCounts)\n    .sort((a, b) => b[1] - a[1])\n    .map(([k, v]) => `${k}:${v}`)\n    .join(', ');\n  subtitle = `※地図未配置 (Tor/不明/その他): 計 ${unmappedTotal.toLocaleString()} 件 (${details})`;\n}\n\nreturn {\n  backgroundColor: 'transparent',\n  title: subtitle ? {\n    subtext: subtitle,\n    left: 10,\n    bottom: 8,\n    subtextStyle: {\n      color: '#e06c75',\n      fontSize: 11\n    }\n  } : undefined,\n  tooltip: {\n    trigger: 'item',\n    backgroundColor: 'rgba(20, 24, 33, 0.9)',\n    borderColor: '#303846',\n    textStyle: {\n      color: '#e6edf3'\n    },\n    formatter: function (params) {\n      if (params.seriesType === 'lines') {\n        return `<div style=\"font-weight:bold;margin-bottom:4px;\">攻撃アーク</div>` +\n               `送信元: <b>${params.data.fromName}</b><br/>` +\n               `着信先: <b>${params.data.toName}</b><br/>` +\n               `試行回数: <b style=\"color:#ff4d4f;\">${params.data.value.toLocaleString()}</b> 回`;\n      }\n      if (params.seriesType === 'effectScatter') {\n        if (params.data.name === 'Nuage Cluster (Tokyo)') {\n          return `<b>${params.data.name}</b><br/>Nuage Kubernetes Cluster 標的受信拠点`;\n        }\n        return `国コード: <b>${params.data.name}</b><br/>攻撃試行回数: <b style=\"color:#ff4d4f;\">${params.data.value[2]?.toLocaleString()}</b> 回`;\n      }\n      return params.name;\n    }\n  },\n  geo: {\n    map: 'world',\n    roam: true,\n    zoom: 1.25,\n    center: [120, 25],\n    label: {\n      show: false,\n      emphasis: {\n        show: false\n      }\n    },\n    itemStyle: {\n      areaColor: '#1a1f2c',\n      borderColor: '#303846',\n      borderWidth: 0.8\n    },\n    emphasis: {\n      itemStyle: {\n        areaColor: '#273142'\n      }\n    }\n  },\n  series: [\n    {\n      name: 'Attack Lines',\n      type: 'lines',\n      coordinateSystem: 'geo',\n      zlevel: 2,\n      effect: {\n        show: true,\n        period: 6,\n        trailLength: 0.7,\n        color: '#ff4d4f',\n        symbolSize: 3\n      },\n      lineStyle: {\n        color: '#ff4d4f',\n        opacity: 0.55,\n        curveness: 0.25\n      },\n      data: lineData\n    },\n    {\n      name: 'Nuage Cluster',\n      type: 'effectScatter',\n      coordinateSystem: 'geo',\n      zlevel: 3,\n      rippleEffect: {\n        brushType: 'stroke',\n        scale: 4,\n        period: 4\n      },\n      label: {\n        show: true,\n        position: 'right',\n        formatter: '{b}',\n        color: '#00e676',\n        fontSize: 11,\n        fontWeight: 'bold'\n      },\n      itemStyle: {\n        color: '#00e676',\n        shadowBlur: 10,\n        shadowColor: '#00e676'\n      },\n      data: [\n        {\n          name: 'Nuage Cluster (Tokyo)',\n          value: [TOKYO_COORD[0], TOKYO_COORD[1]]\n        }\n      ]\n    },\n    {\n      name: 'Source Countries',\n      type: 'effectScatter',\n      coordinateSystem: 'geo',\n      zlevel: 3,\n      rippleEffect: {\n        brushType: 'stroke',\n        scale: 3,\n        period: 5\n      },\n      label: {\n        show: true,\n        position: 'top',\n        formatter: '{b}',\n        color: '#ff7875',\n        fontSize: 10\n      },\n      itemStyle: {\n        color: '#ff4d4f',\n        shadowBlur: 6,\n        shadowColor: '#ff4d4f'\n      },\n      data: sourcePointData\n    }\n  ]\n};"
          }
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "国別攻撃数ランキング Top 10",
          "description": "選択期間内にハニーポットへ攻撃を試みた攻撃元国の Top 10 ランキング。※国コードは Cloudflare 経由の HTTP 攻撃のみ付与されます。",
          "gridPos": {
            "h": 14,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | filter details.country:!=\"\" | stats by (details.country) count() as count | sort by (count desc, details.country asc) | limit 10",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{details.country}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "noValue": "0",
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "標的エンドポイント・プロトコル推移",
          "description": "選択期間内の時間帯別攻撃試行回数推移（プロトコル別積層グラフ）。",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\" | stats by (protocol) count() as count",
              "queryType": "statsRange",
              "editorMode": "code",
              "legendFormat": "{{protocol}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "sum",
                "max"
              ],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "table",
          "title": "直近の攻撃試行一覧",
          "description": "直近検知された攻撃試行の詳細（発生時刻、国コード、送信元 IP、プロトコル、標的パス、入力ペイロード / クレデンシャル等、最新50件）。パスワードは自動マスクされます。",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\"\n| replace_regexp (\".+\", \"***\") at details.password\n| replace_regexp (\"([\\\"\\']?password[\\\"\\']?\\s*[:=]\\s*[\\\"\\']?)[^&\\\"\\',}]+\", \"$1***\") at details.body\n| default(details.body, details.username, details.user, \"-\") as payload\n| fields _time, details.country, src_ip, protocol, details.path, payload\n| sort by (_time desc)\n| limit 50",
              "queryType": "instant",
              "editorMode": "code"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "format": "auto",
                "source": "labels"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Line": true,
                  "labels": true
                },
                "indexByName": {
                  "Time": 0,
                  "_time": 0,
                  "details.country": 1,
                  "country": 1,
                  "src_ip": 2,
                  "protocol": 3,
                  "details.path": 4,
                  "path": 4,
                  "payload": 5,
                  "details.body": 5,
                  "body": 5
                },
                "renameByName": {
                  "Time": "発生時刻",
                  "_time": "発生時刻",
                  "details.country": "国コード",
                  "country": "国コード",
                  "src_ip": "送信元 IP",
                  "protocol": "プロトコル",
                  "details.path": "標的パス",
                  "path": "標的パス",
                  "payload": "入力ペイロード / クレデンシャル",
                  "details.body": "入力ペイロード / クレデンシャル",
                  "body": "入力ペイロード / クレデンシャル"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "発生時刻"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 180
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "国コード"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "送信元 IP"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "プロトコル"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 110
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "ssh": {
                            "color": "orange",
                            "index": 0,
                            "text": "SSH"
                          },
                          "http": {
                            "color": "blue",
                            "index": 1,
                            "text": "HTTP"
                          },
                          "postgres": {
                            "color": "purple",
