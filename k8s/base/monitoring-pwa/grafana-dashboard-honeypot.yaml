apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-honeypot
  labels:
    grafana_dashboard: "1"
data:
  honeypot-attack-map.json: |
    {
      "title": "Honeytrap Attack Map & Analytics",
      "uid": "nuage-honeytrap-attack-map",
      "tags": [
        "nuage",
        "security",
        "honeytrap"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 6,
          "type": "text",
          "title": "LogsQL フィルターの使い方",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 6
          },
          "options": {
            "mode": "markdown",
            "content": "**分類（複数選択）と検索条件を指定して Enter** → 地図・全グラフ・一覧に適用。**分類が All・検索が空なら全件**。分類を絞るときは All のチェックを外す。\n\n例: `details.path:=\"/.git\"*` ／ 大小文字を区別せず AGENT を含むパス: `details.path:~\"(?i)^/.*agent\"` ／ 指定 IP を除外: `NOT src_ip:=\"192.0.2.25\"`。`AND`・`OR`・`NOT`・括弧で組み合わせられる。\n\nHTTP の判定保留は `/`・`/robots.txt`・`/favicon.ico` の GET/HEAD のみ。それ以外は原則「探索」、認証要求・攻撃文字列は「侵入・悪用試行」（攻撃意図・成功の断定ではない）。期間は右上、地図は国情報付き HTTP のみ。検索欄は絞り込み条件用（集計パイプ不可）。"
          }
        },
        {
          "id": 7,
          "type": "bargauge",
          "title": "分類別の通信件数",
          "description": "上部の共通フィルターに一致する通信を分類別に集計する。0件の分類は系列が返らないため表示されない。",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "kubernetes.pod_namespace:=\"nuage-honeytrap\" event:=\"honeypot_attack\"\n| ${traffic_classifier:raw}\n| format if (${known_traffic:raw}) \"operational\" as traffic_class\n| format if (traffic_class:=\"operational\") \"確認済みの監視・試験の条件に一致\" as classification_reason\n| coalesce (_msg, classification_reason) as _msg\n| filter traffic_class:~\"^(${traffic_class:regex})$\"\n| filter (${effective_logsql:raw})\n| stats by (traffic_class) count() as count | sort by (count desc)",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{traffic_class}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "unit": "short",
              "displayName": "${__field.labels.traffic_class}",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*operational.*"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "既知の監視・試験"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*unknown.*"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "判定保留"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "gray"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*probe.*"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "探索"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*attack.*"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "侵入・悪用試行"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 1,
          "type": "volkovlabs-echarts-panel",
          "title": "通信元マップ (HTTP → Nuage Tokyo)",
          "description": "上部の LogsQL フィルターに一致する通信を国別に集計する。国情報が付く Cloudflare 経由の HTTP のみが対象で、SSH・PostgreSQL・国情報のない通信は地図に含まれない。線の太さは通信件数の対数スケール。国は接続元 IP の位置を表し、攻撃者の所在地を断定しない。",
          "gridPos": {
            "h": 14,
            "w": 16,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
