apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-health
  labels:
    grafana_dashboard: "1"
data:
  node-health.json: |
    {
      "title": "Node Health Overview",
      "uid": "nuage-node-health",
      "tags": ["nuage", "node-exporter"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "全ノード健全性",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count by (instance, nodename) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(node_uname_info{job=~\"node-exporter|external-nodes\"}, \"nodename\", \"control-plane-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.11:9100$\"), \"nodename\", \"control-plane-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.12:9100$\"), \"nodename\", \"control-plane-3\", \"instance\", \"^10\\\\.20\\\\.1\\\\.13:9100$\"), \"nodename\", \"worker-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.16:9100$\"), \"nodename\", \"worker-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.17:9100$\"), \"nodename\", \"worker-3\", \"instance\", \"^10\\\\.20\\\\.1\\\\.18:9100$\"))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (instance) (up{job=~\"node-exporter|external-nodes\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - (avg by (instance) (irate(node_cpu_seconds_total{job=~\"node-exporter|external-nodes\",mode=\"idle\"}[5m])) * 100)",
              "format": "table",
              "instant": true
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - 100 * (sum by (instance) (node_memory_MemAvailable_bytes{job=~\"node-exporter|external-nodes\"}) / sum by (instance) (node_memory_MemTotal_bytes{job=~\"node-exporter|external-nodes\"}))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "E",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - 100 * (sum by (instance) (node_filesystem_free_bytes{job=~\"node-exporter|external-nodes\",mountpoint=~\"^(/var|/)$\"}) / sum by (instance) (node_filesystem_size_bytes{job=~\"node-exporter|external-nodes\",mountpoint=~\"^(/var|/)$\"}))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "instance",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "instance": true,
                  "Value #A": true
                },
                "indexByName": {
                  "nodename": 0,
                  "Value #B": 1,
                  "Value #C": 2,
                  "Value #D": 3,
                  "Value #E": 4
                },
                "renameByName": {
                  "nodename": "Node",
                  "Value #B": "Status",
                  "Value #C": "CPU (%)",
                  "Value #D": "Memory (%)",
                  "Value #E": "Disk (%)"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [{ "field": "Node" }]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "center",
                "cellOptions": { "type": "auto" }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  { "id": "unit", "value": "none" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": { "text": "Up", "color": "green", "index": 0 },
                          "0": { "text": "Down", "color": "red", "index": 1 }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "green", "value": 1 }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "CPU (%)" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "max", "value": 100 },
                  { "id": "min", "value": 0 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Memory (%)" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "max", "value": 100 },
                  { "id": "min", "value": 0 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Disk (%)" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "max", "value": 100 },
                  { "id": "min", "value": 0 }
                ]
              }
            ]
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "AutoUpgrade 実行状況 (loadbalancer / postgres-cluster / minio-cluster)",
          "description": "対象ホストのnode-exporterで--collector.systemdが有効化されるまでデータは表示されません。",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(node_systemd_timer_last_trigger_seconds{job=\"external-nodes\", name=\"nixos-upgrade.timer\"}, \"host\", \"lb-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.21:9100$\"), \"host\", \"lb-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.22:9100$\"), \"host\", \"lb-3\", \"instance\", \"^10\\\\.20\\\\.1\\\\.23:9100$\"), \"host\", \"pg-cluster-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.41:9100$\"), \"host\", \"pg-cluster-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.42:9100$\"), \"host\", \"pg-cluster-3\", \"instance\", \"^10\\\\.20\\\\.1\\\\.43:9100$\"), \"host\", \"minio-cluster-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.71:9100$\"), \"host\", \"minio-cluster-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.72:9100$\") * 1000",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(node_systemd_unit_state{job=\"external-nodes\", name=\"nixos-upgrade.service\"} == 1, \"host\", \"lb-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.21:9100$\"), \"host\", \"lb-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.22:9100$\"), \"host\", \"lb-3\", \"instance\", \"^10\\\\.20\\\\.1\\\\.23:9100$\"), \"host\", \"pg-cluster-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.41:9100$\"), \"host\", \"pg-cluster-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.42:9100$\"), \"host\", \"pg-cluster-3\", \"instance\", \"^10\\\\.20\\\\.1\\\\.43:9100$\"), \"host\", \"minio-cluster-1\", \"instance\", \"^10\\\\.20\\\\.1\\\\.71:9100$\"), \"host\", \"minio-cluster-2\", \"instance\", \"^10\\\\.20\\\\.1\\\\.72:9100$\")",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "host",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "instance": true,
                  "instance 1": true,
                  "job": true,
                  "job 1": true,
                  "name": true,
                  "name 1": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "Value #B": true
                },
                "indexByName": {
                  "host": 0,
                  "Value #A": 1,
                  "state": 2
                },
                "renameByName": {
                  "host": "Host",
                  "Value #A": "最終実行",
                  "state": "状態"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [{ "field": "Host" }]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "center",
                "cellOptions": { "type": "auto" }
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "最終実行" },
                "properties": [{ "id": "unit", "value": "dateTimeFromNow" }]
              },
              {
                "matcher": { "id": "byName", "options": "状態" },
                "properties": [
                  { "id": "unit", "value": "none" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "inactive": { "text": "成功", "color": "green", "index": 0 },
                          "failed": { "text": "失敗", "color": "red", "index": 1 },
                          "active": { "text": "実行中", "color": "blue", "index": 2 },
                          "activating": { "text": "実行中", "color": "blue", "index": 3 },
                          "deactivating": { "text": "終了処理中", "color": "blue", "index": 4 }
                        }
                      },
                      {
                        "type": "special",
                        "options": {
                          "match": "null",
                          "result": { "text": "未取得", "color": "text" }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        }
      ]
    }
