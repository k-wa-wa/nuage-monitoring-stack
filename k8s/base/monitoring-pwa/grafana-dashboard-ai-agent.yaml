              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "pr": 0,
                  "task": 1,
                  "branch": 2,
                  "repo": 3,
                  "impl": 4,
                  "result": 5,
                  "Value": 6
                },
                "renameByName": {
                  "pr": "PR 番号",
                  "task": "タスク名",
                  "branch": "ブランチ",
                  "repo": "リポジトリ",
                  "impl": "担当",
                  "result": "結果",
                  "Value": "実行回数"
                }
              }
            }
          ],
