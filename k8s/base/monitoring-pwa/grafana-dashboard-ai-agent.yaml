            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(increase(nuage_ai_agent_tokens_total[1d]))",
              "instant": true
