      "title": "AI Agent Usage Overview",
      "uid": "nuage-ai-agent-usage",
      "tags": [
        "nuage",
        "ai-agent"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 14,
          "type": "stat",
          "title": "今日の総推定コスト (USD)",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "((sum(increase(nuage_ai_agent_tokens_total{model=~\".*opus.*\", type=~\"input|cache_creation\"}[1d])) or vector(0)) * (15 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*opus.*\", type=\"output\"}[1d])) or vector(0)) * (75 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*opus.*\", type=\"cache_read\"}[1d])) or vector(0)) * (1.5 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*sonnet.*\", type=~\"input|cache_creation\"}[1d])) or vector(0)) * (3 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*sonnet.*\", type=\"output\"}[1d])) or vector(0)) * (15 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*sonnet.*\", type=\"cache_read\"}[1d])) or vector(0)) * (0.3 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*haiku.*\", type=~\"input|cache_creation\"}[1d])) or vector(0)) * (0.8 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*haiku.*\", type=\"output\"}[1d])) or vector(0)) * (4 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*haiku.*\", type=\"cache_read\"}[1d])) or vector(0)) * (0.08 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*flash.*\", type=~\"input|cache_creation\"}[1d])) or vector(0)) * (0.1 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*flash.*\", type=\"output\"}[1d])) or vector(0)) * (0.4 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*flash.*\", type=\"cache_read\"}[1d])) or vector(0)) * (0.025 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*argon.*\", type=~\"input|cache_creation\"}[1d])) or vector(0)) * (2 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*argon.*\", type=\"output\"}[1d])) or vector(0)) * (8 / 1e6) + (sum(increase(nuage_ai_agent_tokens_total{model=~\".*argon.*\", type=\"cache_read\"}[1d])) or vector(0)) * (0.5 / 1e6))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              },
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "description": "主要商用モデル（Opus, Sonnet, Haiku, Flash, Argon）の概算単価に基づく推定コスト。未算定モデルの消費は「コスト未算定トークン」パネルを参照。"
