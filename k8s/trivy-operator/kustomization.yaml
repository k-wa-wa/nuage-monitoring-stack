# trivy-operator 一式 (k8s のイメージ脆弱性・設定不備の検査とその Grafana ダッシュボード)。
# prod overlay だけが読む。preview overlay には入れない (CRD・ClusterRole がクラスター共有で、PR ごとに複製する意味が無いため)。
#
# 監視スタック本体 (nuage-monitoring-stack) とは別の trivy-operator Namespace に置く。
# networkpolicy.yaml の CiliumNetworkPolicy は endpointSelector: {} で Namespace 内の全 Pod に効くため、
# 監視スタックと同じ Namespace に置くと監視スタック全体の通信を絞ってしまう。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Helm チャートのリソースには namespace を持たないものがあるため、ここで trivy-operator にそろえる
# (ClusterRoleBinding の subjects も含む)。
namespace: trivy-operator

resources:
  # Argo CD の CreateNamespace=true は destination の nuage-monitoring-stack にしか効かないため、Namespace をリソースとして持つ
  - namespace.yaml
  - networkpolicy.yaml
  - vmscrape.yaml

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts/
    releaseName: trivy-operator
    namespace: trivy-operator
    version: 0.38.1
    includeCRDs: true
    valuesInline:
      operator:
        replicas: 1
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
        scanJobsConcurrentLimit: 1
        # aivisspeech (pechka) のスキャンが既定の 5m (activeDeadlineSeconds: 300) で打ち切られ、
        # VulnerabilityReport が作られないまま評価から落ちていたため 30m に延ばす。
        # 実スキャン所要時間は未計測のため、大きな ML イメージでも収まるよう余裕を持たせた。
        scanJobTimeout: 30m
        # 複数コンテナを持つ Pod (argocd-repo-server 等) のスキャンで、同一 Job 内のコンテナ同士が
        # /tmp/trivy/.cache の BoltDB ロックを取り合って失敗するため、組み込み Trivy サーバーを使う
        # ClientServer モードに切り替える (スキャン Job はローカルキャッシュを開かずサーバーに委譲する)。
        builtInTrivyServer: true
        vulnerabilityScannerScanOnlyCurrentRevisions: true
        exposedSecretScannerEnabled: false
        infraAssessmentScannerEnabled: false
        clusterComplianceEnabled: false
        accessGlobalSecretsAndServiceAccount: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          # operator が OOMKilled で CrashLoopBackOff になったため 512Mi から上げた。
          memory: 1Gi
      trivy:
        offlineScan: true
        # operator.scanJobTimeout と合わせて Trivy CLI 側の制限時間も 30m0s に延ばす (既定 5m0s)。
        timeout: "30m0s"
        # キャッシュ専用のため PVC を作らず emptyDir を使う (再起動時は起動時に trivy-db を再取得する)。
        storageClassEnabled: false
        server:
          # requests は控えめにしつつ、limits.memory は trivy.db 展開や同時処理での OOMKilled を防ぐため
          # チャート既定値の 1Gi にそろえる (operator 本体も 512Mi で OOMKilled になった経緯がある)。
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

configMapGenerator:
  # このダッシュボードは k8s/base/victoria/rules.yaml の VMRule trivy-summary-rules (recording rule) に依存する。
  #   - nuage:trivy_image_vulnerabilities:dedup_by_image (脆弱性をイメージの digest 単位で重複を除いた件数)
  #   - nuage:trivy_resource_configaudits:dedup_by_workload (設定不備を workload 単位にまとめた件数。
  #     Misconfiguration by Namespace の表は、このルールの式を写して Namespace ごとに分けている)
  #   - nuage:trivy_scan_target:by_workload (スキャン対象のワークロード一覧。Scan Coverage 行と Vulnerabilities by Workload の表で使う)
  # 同じファイルの VMRule trivy-rbac-accepted-rules (recording rule) にも依存する。
  #   - nuage:trivy_clusterrbac_accepted_findings (確認済みの ClusterRole の RBAC の指摘の一覧。Overview の Kubernetes: RBAC Assessment と
  #     RBAC Issues by Namespace の (cluster-wide) 行の Critical から除き、Accepted ClusterRole Findings・Accepted List Out of Date の表に出す)
  # ルール名や数え方を変えるときは、このダッシュボードのクエリもあわせて直す。
  # リポジトリのスキャン (Scan Coverage・Overview・Repositories 行) は、k8s/repo-scan の CronJob が送る次のメトリクスに依存する。
  #   - nuage_repo_scan_findings{repo, category, severity} (指摘の件数)
  #   - nuage_repo_scan_last_success_timestamp_seconds{repo} (最後に成功した時刻)
  #   - nuage_repo_scan_target{repo} (対象のリポジトリ)
  # メトリクス名・ラベルを変えるとき (k8s/repo-scan/scripts/aggregate.py) は、このダッシュボードのクエリもあわせて直す。
  # 指摘の一覧 (VictoriaLogs の kubernetes.pod_namespace="repo-scan" の JSON 行) はこのダッシュボードには出さない。Explore で見る。
  # SSVC Prioritization 行は k8s/ssvc の CronJob が送る次のメトリクスとログに依存する。
  #   - nuage_ssvc_findings{source, namespace, target, decision}
  #   - nuage_ssvc_exploitation_findings{source, namespace, target, exploitation}
  #   - nuage_ssvc_active_exploitation_total
  #   - nuage_ssvc_unscanned_assets{host, kind, human_impact, exposure} / nuage_ssvc_unscanned_assets_total
  #   - nuage_ssvc_no_scan_result_targets_total
  #   - nuage_ssvc_expired_overrides_total
  #   - nuage_ssvc_last_run_timestamp_seconds
  #   - nuage_ssvc_last_success_timestamp_seconds
  #   - VictoriaLogs の kubernetes.pod_namespace="ssvc" (event="ssvc_finding" / "no_scan_result" / "expired_override" / "eval_done")
  # Grafana の sidecar は全 Namespace を見る (searchNamespace: ALL) ため、trivy-operator Namespace に置いても読み込まれる。
  - name: trivy-operator-dashboard
    files:
      - dashboards/trivy-operator.json
    options:
      annotations:
        grafana_folder: nuage
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
