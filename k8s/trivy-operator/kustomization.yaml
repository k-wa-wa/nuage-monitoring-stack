# trivy-operator 一式 (k8s のイメージ脆弱性・設定不備の検査とその Grafana ダッシュボード)。
# prod overlay だけが読む。preview overlay には入れない (CRD・ClusterRole がクラスター共有で、PR ごとに複製する意味が無いため)。
#
# 監視スタック本体 (nuage-monitoring-stack) とは別の trivy-operator Namespace に置く。
# networkpolicy.yaml の CiliumNetworkPolicy は endpointSelector: {} で Namespace 内の全 Pod に効くため、
# 監視スタックと同じ Namespace に置くと監視スタック全体の通信を絞ってしまう。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Helm チャートのリソースには namespace を持たないものがあるため、ここで trivy-operator にそろえる
# (ClusterRoleBinding の subjects も含む)。
namespace: trivy-operator

resources:
  # Argo CD の CreateNamespace=true は destination の nuage-monitoring-stack にしか効かないため、Namespace をリソースとして持つ
  - namespace.yaml
  - networkpolicy.yaml
  - vmscrape.yaml

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts/
    releaseName: trivy-operator
    namespace: trivy-operator
    version: 0.38.1
    includeCRDs: true
    valuesInline:
      operator:
        replicas: 1
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
        scanJobsConcurrentLimit: 1
        vulnerabilityScannerScanOnlyCurrentRevisions: true
        exposedSecretScannerEnabled: false
        infraAssessmentScannerEnabled: false
        clusterComplianceEnabled: false
        accessGlobalSecretsAndServiceAccount: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          # operator が OOMKilled で CrashLoopBackOff になったため 512Mi から上げた。
          memory: 1Gi
      trivy:
        offlineScan: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

configMapGenerator:
  # このダッシュボードは k8s/base/victoria/rules.yaml の VMRule trivy-summary-rules (recording rule) に依存する。
  #   - nuage:trivy_image_vulnerabilities:dedup_by_image (脆弱性をイメージの digest 単位で重複を除いた件数)
  #   - nuage:trivy_resource_configaudits:dedup_by_workload (設定不備を workload 単位にまとめた件数。
  #     Misconfiguration by Namespace の表は、このルールの式を写して Namespace ごとに分けている)
  #   - nuage:trivy_scan_target:by_workload (スキャン対象のワークロード一覧。Scan Coverage 行と Vulnerabilities by Workload の表で使う)
  # ルール名や数え方を変えるときは、このダッシュボードのクエリもあわせて直す。
  # リポジトリのスキャン (Scan Coverage・Overview・Repositories 行) は、k8s/repo-scan の CronJob が送る次のメトリクスに依存する。
  #   - nuage_repo_scan_findings{repo, category, severity} (指摘の件数)
  #   - nuage_repo_scan_last_success_timestamp_seconds{repo} (最後に成功した時刻)
  #   - nuage_repo_scan_target{repo} (対象のリポジトリ)
  # メトリクス名・ラベルを変えるとき (k8s/repo-scan/scripts/aggregate.py) は、このダッシュボードのクエリもあわせて直す。
  # 指摘の一覧 (VictoriaLogs の kubernetes.pod_namespace="repo-scan" の JSON 行) はこのダッシュボードには出さない。Explore で見る。
  # Grafana の sidecar は全 Namespace を見る (searchNamespace: ALL) ため、trivy-operator Namespace に置いても読み込まれる。
  - name: trivy-operator-dashboard
    files:
      - dashboards/trivy-operator.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
